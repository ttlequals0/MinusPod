name: Security packages image (multi-arch)

# Builds ttlequals0/minuspod-security-packages (amd64 + arm64) tagged by the content hash of the patch inputs.
# Runs on PRs that change them; scripts/bump_security_packages.sh then pins the digest in both Dockerfiles.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the hash tag exists"
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/*-security/**"
      - "scripts/build_media_security_packages.py"
      - "Dockerfile.security-packages"

permissions:
  contents: read

concurrency:
  group: security-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ttlequals0/minuspod-security-packages

jobs:
  plan:
    name: Plan build
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      skip: ${{ steps.exists.outputs.skip }}
      force: ${{ steps.exists.outputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute hash
        id: hash
        run: echo "hash=$(python3 scripts/security_packages_hash.py)" >> "$GITHUB_OUTPUT"

      - name: Check for existing tag
        id: exists
        env:
          HASH: ${{ steps.hash.outputs.hash }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && docker buildx imagetools inspect "$REGISTRY_IMAGE:$HASH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "force=$([ "$FORCE" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_id: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_id: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Free unused hosted-runner SDK storage
        if: matrix.platform == 'linux/amd64'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Docker Hub login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile.security-packages
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ttlequals0/MinusPod
            io.minuspod.inputs-hash=${{ needs.plan.outputs.hash }}
          no-cache: ${{ needs.plan.outputs.force == 'true' }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.arch_id }}
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.arch_id }},mode=max

      - name: Export digest
        env:
          ARCH_ID: ${{ matrix.arch_id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "build-push-action produced no digest output" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          echo "$IMAGE_DIGEST" > "/tmp/digests/$ARCH_ID"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.arch_id }}
          path: /tmp/digests/${{ matrix.arch_id }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      HASH: ${{ needs.plan.outputs.hash }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: false

      - name: Docker Hub login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          AMD64_DIGEST=$(cat digest-amd64/amd64)
          ARM64_DIGEST=$(cat digest-arm64/arm64)
          # The dated tag keeps every pinned digest pullable after the hash tag moves.
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:${HASH}" \
            -t "${REGISTRY_IMAGE}:${HASH}-$(date -u +%Y%m%d)" \
            "${REGISTRY_IMAGE}@${AMD64_DIGEST}" \
            "${REGISTRY_IMAGE}@${ARM64_DIGEST}"

      - name: Verify both platforms
        run: |
          set -euo pipefail
          RAW=$(docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}:${HASH}")
          for platform in amd64 arm64; do
            echo "$RAW" | grep -q "\"architecture\": *\"$platform\"" || { echo "Missing linux/$platform in manifest" >&2; exit 1; }
          done
