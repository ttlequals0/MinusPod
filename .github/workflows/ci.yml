name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TORCH_VERSION: "2.13.0"  # keep in sync with the Dockerfiles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache torch CPU wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-torch-cpu-${{ env.TORCH_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-torch-cpu-${{ env.TORCH_VERSION }}-

      - name: Install CPU-only torch (matches Dockerfile)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install project requirements
        run: pip install -r requirements.txt

      - name: Check Markdown links and anchors
        run: python scripts/check_markdown_links.py

      - name: Set up Node 22 (for frontend build that produces static/ui)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (favicon and static asset tests require it)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Run pytest
        env:
          PYTHONPATH: src
        run: pytest tests/ -n auto -v --tb=short

      - name: Container import-path gate
        # Already collected by the run above (tests/ is scanned recursively);
        # run it again by name so a boot-path regression shows as its own
        # named CI failure instead of being buried in the full-suite log.
        env:
          PYTHONPATH: src
        run: pytest tests/unit/test_container_import_paths.py -v --tb=short

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Check design guide parity
        run: npm run design:check

      - name: Install browser
        run: npx playwright install --with-deps chromium webkit

      - name: Browser UI contracts
        run: npm run test:browser

      - name: Test (Vitest)
        run: npm run test

      - name: Build (runs tsc then vite build)
        run: npm run build

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements
        run: pip-audit --requirement requirements.txt --strict

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit
        run: npm audit --audit-level=high

  ruff:
    name: ruff (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check security packages pin
        run: python3 scripts/security_packages_hash.py --check

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.20

      - name: Lint (ruff)
        run: ruff check src tests
