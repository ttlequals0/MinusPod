description = "<p>While court cases and eligibility concerns have been a popular discussion point through the early part of the college football season, the conversation continues as Stephen Daley and Kellen Wyatt have been ruled eligible to play for the Hoosiers following a court ruling in Indiana. While Indiana opens up conference play vs Northwestern on Friday night, will the newly eligible players just make Indiana tougher to deal with? Andy discusses the latest in Bloomington.</p><p>(0:00) On Today's Episode<br />(0:58) Presenting Sponsor<br />(2:00) Intro: Indiana's players eligible<br />(7:50) Gametime<br />(8:54) Previewing George Wrighster<br />(9:18) George Wrighster joins<br />(10:10) Concerns with Oregon?<br />(23:14) USC Truther?<br />(29:20) QB translation to the NFL<br />(38:56) Oregon State QB<br />(40:29) SEC TV - STEALING Big Ten Thunder?<br />(58:40) Closing out with George<br />(1:00:48) Thanks for watching!</p><p>Next up, George Wrighster from the Unafraid show joins the fellas to discuss the Oregon Ducks taking on the USC Trojans in the LA Memorial Coliseum this weekend. As Ari is going to be at this game, George explains what to look for in this matchup and why both teams have a lot to lose.</p><p>Continuing with George, Andy asks George about the translation of quarterback play in college football to the NFL. While Trinidad Chambliss has taken the college game by storm, will his play translate to the NFL smoothly? What about the others? Is Darian Mensah a true Heisman contender and the sure pick to make it in the NFL? Andy, Ari, and George discuss.</p><p>To close with George, the fellas discuss the television schedule 3 weeks into the season. Now a quarter of the way through the regular season, has the SEC set the narrative that they are the best conference early due to the television schedule so far? Or will all the dust settle in November?</p><p>A jam packed show with Andy &amp; Ari here!</p><p>Our show is presented by Polymarket!</p><p>New