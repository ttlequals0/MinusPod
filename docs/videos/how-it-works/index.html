<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MinusPod: how it works</title>
<!-- Animation source for docs/videos/minuspod-how-it-works.mp4. render.mjs drives window.render(t) frame by frame. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  html, body { margin: 0; background: #15181D; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Scenes draw in portrait coordinates (W x H). The landscape layout places the caption and rail in a left column
// and scales the portrait content box into the right side of a 1920x1080 frame.
const W = 1080, H = 1920, FPS = 30;
const LANDSCAPE = new URLSearchParams(location.search).get('layout') === 'landscape';
const OUT_W = LANDSCAPE ? 1920 : W, OUT_H = LANDSCAPE ? 1080 : H;
const BOX = { top: 520, bottom: 1700 };                      // portrait y range that holds every scene's content
const LS = { capX: 72, capW: 760, scale: (OUT_H - 80) / (BOX.bottom - BOX.top) };
LS.x = OUT_W - 72 - W * LS.scale;
const C = {
  bg: '#15181D', fg: '#F3F5F7', muted: '#9AA3AD', dim: '#5F6873', border: '#3A4049', card: '#1F242B', card2: '#272D35',
  primary: '#5ABFDD', ad: '#EF5F5D', ok: '#05DF73', warn: '#FFB900', teal: '#00C9A7', purple: '#C084FC',
};
// One content column shared by the tape, cards and gate.
const COL_W = 880, COL_X = (W - COL_W) / 2;
// The episode the video follows: runtime and where its ads sit on the bar.
const EP_SEC = 3730;
const ADS = [[0, 0.07], [0.46, 0.57], [0.93, 1]];
const AD_FRAC = ADS.reduce((a, [s, e]) => a + (e - s), 0);
const REMOVED_SEC = Math.round(EP_SEC * AD_FRAC);
// The eleven stages of docs/workflows.md, in order.
const STAGES = ['Download', 'Transcribe', 'Second download', 'Audio analysis', 'Detect ads', 'Validate', 'Boundary review', 'Cut audio', 'Verify pass', 'Transcript, chapters', 'Publish feed'];

const cv = document.getElementById('c'); cv.width = OUT_W; cv.height = OUT_H; const ctx = cv.getContext('2d');
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const seg = (t, a, d) => clamp01((t - a) / d);
const eio = (p) => (p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p);
const eo = (p) => 1 - Math.pow(1 - p, 3);
const lerp = (a, b, p) => a + (b - a) * p;
const font = (w, s) => `${w} ${s}px Roboto`;
// Fade in over inDur from inStart, fade out over outDur before dur ends.
const envelope = (lt, dur, inStart, inDur, outDur) => Math.min(seg(lt, inStart, inDur), seg(dur - lt, 0, outDur));
const logo = new Image(); logo.src = '../../../frontend/public/logo-dark.svg';
window.ready = Promise.all([document.fonts.load(font(700, 64)), document.fonts.load(font(400, 38)), document.fonts.load(font(500, 30)),
  new Promise((r, j) => { logo.onload = r; logo.onerror = () => j(new Error('logo failed to load: ' + logo.src)); if (logo.complete) r(); })]);

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, color) { rr(x, y, w, h, r); ctx.fillStyle = color; ctx.fill(); }
function strokeRR(x, y, w, h, r, color, lw = 2) { rr(x, y, w, h, r); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); }
// Draw fn at opacity p, slid up by dy while it fades in.
function reveal(p, fn, dy = 0) { if (p <= 0) return; ctx.save(); ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * dy); fn(); ctx.restore(); }
function wrap(text, f, maxw) {
  ctx.font = f; const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = (cur + ' ' + w).trim(); if (ctx.measureText(t).width <= maxw) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur); return lines;
}
function text(s, x, y, f, color, align = 'left', alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = f; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); ctx.restore();
}
// Centered footnote, wrapped to the caption width.
function note(str, y, alpha, color = C.muted, size = 28) { reveal(alpha, () => wrap(str, font(400, size), W - 144).forEach((l, i) => text(l, W / 2, y + i * (size + 10), font(400, size), color, 'center'))); }
function pillWidth(label, size = 26, weight = 500) { ctx.font = font(weight, size); return ctx.measureText(label).width + 36; }
function pill(label, x, y, color, { weight = 500, size = 26, align = 'left' } = {}) {
  const pw = pillWidth(label, size, weight), ph = size + 22;
  const px = align === 'center' ? x - pw / 2 : align === 'right' ? x - pw : x;
  ctx.save(); ctx.globalAlpha *= 0.18; fillRR(px, y, pw, ph, ph / 2, color); ctx.restore();
  strokeRR(px, y, pw, ph, ph / 2, color, 1.5);
  text(label, px + pw / 2, y + ph / 2 + size * 0.36, font(weight, size), color, 'center');
  return pw;
}
// Centered row of pills; items are [label, color, alpha].
function pillRow(items, y, gap = 24, size = 26) {
  const widths = items.map(([l]) => pillWidth(l, size)); let x = (W - widths.reduce((a, b) => a + b, 0) - gap * (items.length - 1)) / 2;
  items.forEach(([l, col, a], i) => { const px = x; reveal(a, () => pill(l, px, y, col, { size }), 10); x += widths[i] + gap; });
}
function arrow(x1, y1, x2, y2, color, p = 1, lw = 4) {
  if (p <= 0) return; const ex = lerp(x1, x2, p), ey = lerp(y1, y2, p);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ex, ey); ctx.stroke();
  if (p > 0.95) { const a = Math.atan2(y2 - y1, x2 - x1), s = 16; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - s * Math.cos(a - 0.5), ey - s * Math.sin(a - 0.5)); ctx.lineTo(ex - s * Math.cos(a + 0.5), ey - s * Math.sin(a + 0.5)); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function card(x, y, w, h, title, sub, accent, alpha = 1, r = 22) {
  reveal(alpha, () => {
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; fillRR(x, y, w, h, r, C.card); ctx.shadowColor = 'transparent';
    strokeRR(x, y, w, h, r, C.border, 1.5);
    if (accent) { ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.fillStyle = accent; ctx.fillRect(x, y, 8, h); ctx.restore(); }
    if (title) text(title, x + 34, y + (sub ? 56 : h / 2 + 11), font(700, 32), C.fg);
    if (sub) for (const [i, l] of wrap(sub, font(400, 26), w - 60).entries()) text(l, x + 34, y + 98 + i * 34, font(400, 26), C.muted);
  });
}
// Numbered checklist; done(i) returns 0..1 progress of item i.
function checklist(x, y, items, done, rowH = 86) {
  items.forEach((label, i) => {
    const p = done(i), yy = y + i * rowH, col = p >= 1 ? C.ok : p > 0 ? C.primary : C.dim;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + 22, yy, 20, 0, Math.PI * 2); ctx.stroke();
    if (p >= 1) { ctx.fillStyle = C.ok; ctx.beginPath(); ctx.arc(x + 22, yy, 12, 0, Math.PI * 2); ctx.fill(); }
    else if (p > 0) { ctx.fillStyle = C.primary; ctx.beginPath(); ctx.moveTo(x + 22, yy); ctx.arc(x + 22, yy, 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    text(label, x + 64, yy + 10, font(p > 0 ? 700 : 500, 30), p > 0 ? C.fg : C.dim);
  });
}
function splash(lt, d, draw) {
  const z = 1 + 0.03 * (lt / d);
  reveal(eo(seg(lt, 0.1, 0.8)), () => {
    ctx.translate(OUT_W / 2, LANDSCAPE ? 520 : 860); ctx.scale(z, z);
    const lw = 560, lh = lw * logo.height / logo.width; ctx.drawImage(logo, -lw / 2, -lh - 40, lw, lh);
    draw();
  });
}

// Episode tape: content blocks and ad blocks on a horizontal bar. An ad is [start, end] or [start, end, { alpha, glow }] for per-ad fades.
// Returns the drawn width and the x of each ad (its marker once cut).
function tape(x, y, w, h, opts = {}) {
  const { ads = ADS, adColor = C.ad, adAlpha = 1, alpha = 1, cut = 0, labels = 0, markers = 0, glow = 0, wave = 0, t = 0 } = opts;
  const cw = w * (1 - cut * ads.reduce((a, [s, e]) => a + (e - s), 0));
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.save();
  rr(x, y, cw, h, h / 2); ctx.clip();
  ctx.fillStyle = '#2B4652'; ctx.fillRect(x, y, cw, h);
  ctx.fillStyle = 'rgba(90,191,221,0.18)'; for (let i = 0; i < cw; i += 34) ctx.fillRect(x + i, y, 14, h);
  if (wave > 0) {
    ctx.strokeStyle = `rgba(243,245,247,${0.55 * wave})`; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i <= cw; i += 6) { const n = Math.sin(i * 0.11 + t * 6) * Math.sin(i * 0.037 + 1.3) * Math.sin(i * 0.013 + t); const a = (h * 0.42) * Math.abs(n); ctx.moveTo(x + i, y + h / 2 - a); ctx.lineTo(x + i, y + h / 2 + a); }
    ctx.stroke();
  }
  let shift = 0; const adRects = [];
  for (const [a, b, o = {}] of ads) {
    const ax = x + a * w - shift, aw = (b - a) * w * (1 - cut); shift += (b - a) * w * cut;
    adRects.push([ax, aw, o.glow ?? 1]);
    if (aw > 0.5) { ctx.save(); ctx.globalAlpha *= adAlpha * (o.alpha ?? 1); ctx.fillStyle = adColor; ctx.fillRect(ax, y, aw, h); ctx.fillStyle = 'rgba(0,0,0,0.18)'; for (let i = 0; i < aw; i += 18) ctx.fillRect(ax + i, y, 8, h); ctx.restore(); }
    if (markers > 0 && cut > 0.98) { ctx.save(); ctx.globalAlpha *= markers; ctx.fillStyle = C.teal; ctx.fillRect(ax - 4, y, 8, h); ctx.restore(); }
  }
  ctx.restore();
  if (glow > 0) for (const [ax, aw, g] of adRects) if (aw > 0.5 && g > 0) { ctx.save(); ctx.globalAlpha *= glow * g; ctx.shadowColor = adColor; ctx.shadowBlur = 40; strokeRR(ax - 3, y - 6, aw + 6, h + 12, 8, adColor, 3); ctx.restore(); }
  if (labels > 0) {
    const names = ['pre-roll', 'mid-roll', 'post-roll'];
    adRects.forEach(([ax, aw], i) => reveal(seg(labels, i * 0.25, 0.4), () => { const cx = Math.max(x + 70, Math.min(x + cw - 70, ax + aw / 2)); text(names[i], cx, y + h + 44, font(500, 26), C.ad, 'center'); }, 14));
  }
  ctx.restore();
  return { cw, marks: adRects.map(([ax]) => ax) };
}
function timeLabel(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = Math.floor(s % 60); return `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`; }
const cutLabel = (cut) => timeLabel(EP_SEC - REMOVED_SEC * cut);

// ---------- caption + stage rail ----------
function caption(head, sub, p) {
  const [x, maxw, hs, ss] = LANDSCAPE ? [LS.capX, LS.capW, 56, 34] : [72, W - 144, 62, 38];
  reveal(p, () => {
    let y = LANDSCAPE ? 150 : 170;
    for (const l of wrap(head, font(700, hs), maxw)) { text(l, x, y, font(700, hs), C.fg); y += hs * 1.2; }
    if (sub) { y += 8; for (const l of wrap(sub, font(400, ss), maxw)) { text(l, x, y, font(400, ss), C.muted); y += ss * 1.27; } }
  }, 18);
}
// Eleven numbered chips; the active stages are filled and named underneath.
function rail(active, alpha) {
  reveal(alpha, () => {
    const n = STAGES.length, [y, cw, gap] = LANDSCAPE ? [920, 56, 8] : [1740, 64, 12]; let x = LANDSCAPE ? LS.capX : (W - n * cw - (n - 1) * gap) / 2;
    const labelX = LANDSCAPE ? LS.capX : W / 2, labelAlign = LANDSCAPE ? 'left' : 'center';
    const ai = active.map((s) => STAGES.indexOf(s)), last = Math.max(...ai);
    STAGES.forEach((s, i) => {
      const on = ai.includes(i);
      if (on) fillRR(x, y, cw, 40, 20, C.primary); else strokeRR(x, y, cw, 40, 20, i < last ? C.muted : C.border, 1.5);
      text(String(i + 1).padStart(2, '0'), x + cw / 2, y + 28, font(700, 22), on ? C.bg : i < last ? C.muted : C.dim, 'center');
      x += cw + gap;
    });
    text(active.map((s, i) => `${String(ai[i] + 1).padStart(2, '0')} ${s}`).join('   +   '), labelX, y + 86, font(500, 28), C.primary, labelAlign);
  });
}

// ---------- scenes: duration, headline, subline, draw(localTime, duration), active stages ----------
const scenes = [];
const add = (dur, head, sub, draw, stage) => scenes.push({ dur, head, sub, draw, stage });

add(3.6, '', '', (lt, d) => splash(lt, d, () => {
  text('How it works', 0, 90, font(700, 76), C.fg, 'center');
  text('One episode through all eleven stages.', 0, 160, font(400, 44), C.muted, 'center', eo(seg(lt, 0.6, 0.7)));
}));

add(7.0, 'An episode, as published.', 'Pre-roll, mid-roll, post-roll. Below it, the shorter file MinusPod serves instead.', (lt) => {
  const y1 = 760, h = 96, grow = eo(seg(lt, 0.1, 0.9));
  tape(COL_X, y1, COL_W, h, { alpha: grow, labels: seg(lt, 0.9, 1.4), adAlpha: eo(seg(lt, 0.6, 0.6)) });
  text(timeLabel(EP_SEC), COL_X + COL_W, y1 - 28, font(500, 30), C.muted, 'right', grow);
  arrow(W / 2, y1 + h + 90, W / 2, y1 + h + 230, C.primary, eo(seg(lt, 2.2, 0.7)));
  const p2 = seg(lt, 2.6, 1.2);
  if (p2 > 0) {
    const y2 = y1 + h + 290, cut = eio(p2);
    const { cw } = tape(COL_X, y2, COL_W, h, { cut, markers: seg(lt, 3.9, 0.6) });
    text(cutLabel(cut), COL_X + cw, y2 - 28, font(500, 30), C.ok, 'right');
    reveal(eo(seg(lt, 4.3, 0.8)), () => text(`${Math.floor(REMOVED_SEC / 60)} min ${REMOVED_SEC % 60} s shorter`, W / 2, y2 + h + 70, font(500, 30), C.ok, 'center'), 12);
  }
});

add(6.4, 'Download.', 'Work arrives three ways and joins one queue. One episode at a time, unless you turn on the Whisper pool.', (lt) => {
  const src = [['Scheduled poll', 'every feed, on a timer'], ['Publisher announcement', 'Podping, the moment it drops'], ['You press play', 'the app asks for it first']];
  const cx = 110, cw = 470, ch = 130, ys = [660, 840, 1020];
  const qx = 700, qy = 660, qw = 280, qh = 490;
  src.forEach(([t, s], i) => { const p = eo(seg(lt, 0.1 + i * 0.35, 0.6)); card(cx - (1 - p) * 60, ys[i], cw, ch, t, s, C.primary, p); });
  reveal(eo(seg(lt, 1.2, 0.7)), () => { strokeRR(qx, qy, qw, qh, 26, C.border, 2); text('Queue', qx + qw / 2, qy + 50, font(700, 30), C.fg, 'center'); });
  src.forEach((_, i) => arrow(cx + cw + 14, ys[i] + ch / 2, qx - 14, qy + 110 + i * 150, C.dim, eo(seg(lt, 1.5 + i * 0.3, 0.6)), 3));
  const chip = (yy, w) => { fillRR(qx + 30, yy, qw - 60, 80, 16, C.card2); fillRR(qx + 46, yy + 28, w, 24, 12, w === 90 ? C.primary : C.dim); };
  for (let i = 0; i < 3; i++) { const p = eo(seg(lt, 2.1 + i * 0.3, 0.5)); reveal(p, () => { ctx.translate((1 - p) * 40, 0); chip(qy + 90 + i * 110, 90 + i * 30); }); }
  // The first chip leaves the queue: its file is fetched and the pipeline starts.
  const leave = eio(seg(lt, 3.8, 1.2));
  if (leave > 0) { fillRR(qx + 30, qy + 90, qw - 60, 80, 16, C.bg); chip(lerp(qy + 90, qy + qh + 120, leave), 90); }
  reveal(eo(seg(lt, 3.6, 0.6)), () => { const py = qy + qh + 100; strokeRR(qx - 60, py, qw + 120, 120, 26, C.primary, 2); text('Fetch the published file', qx + qw / 2, py + 174, font(500, 28), C.primary, 'center'); });
  arrow(qx + qw / 2, qy + qh + 10, qx + qw / 2, qy + qh + 86, C.primary, eo(seg(lt, 3.3, 0.5)), 3);
}, ['Download']);

add(7.0, 'Transcribe.', 'Whisper or Parakeet on your own GPU or CPU, or a remote Whisper API. Speech becomes timestamped text, nothing more. The slowest step.', (lt) => {
  const y = 700, h = 96; tape(COL_X, y, COL_W, h, { ads: [], wave: eo(seg(lt, 0.2, 0.8)), t: lt });
  const n = 4, cwid = COL_W / n, prog = seg(lt, 0.6, 4.6) * n;
  for (let i = 0; i < n; i++) {
    const p = clamp01(prog - i), col = p >= 1 ? C.ok : p > 0 ? C.primary : C.dim, x0 = COL_X + i * cwid + 6, x1 = COL_X + (i + 1) * cwid - 6;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y + h + 26); ctx.lineTo(x0, y + h + 44); ctx.lineTo(x1, y + h + 44); ctx.lineTo(x1, y + h + 26); ctx.stroke();
    if (p > 0 && p < 1) { ctx.fillStyle = C.primary; ctx.fillRect(x0, y + h + 40, (x1 - x0) * p, 6); }
    ctx.restore(); text(`chunk ${i + 1}`, COL_X + (i + 0.5) * cwid, y + h + 84, font(500, 24), col, 'center');
  }
  const lines = [['00:00:12', 'welcome back to the show, this week we are'], ['00:00:19', 'looking at what changed in the new release and'], ['00:00:27', 'why it matters for anyone who hosts their own'], ['00:28:41', 'this episode is brought to you by'], ['00:28:44', 'use code SHOW for twenty percent off your first'], ['00:29:03', 'and now back to it, so the first thing we noticed']];
  const ty = 1000, chars = Math.floor(seg(lt, 1.0, 5.2) * 260); let used = 0;
  lines.forEach(([ts, s], i) => { const avail = chars - used; if (avail <= 0) return; const shown = s.slice(0, avail); used += s.length;
    const yy = ty + i * 78; fillRR(COL_X, yy - 44, COL_W, 64, 14, C.card);
    text(ts, COL_X + 24, yy, font(500, 26), C.primary); text(shown + (avail < s.length ? '|' : ''), COL_X + 170, yy, font(400, 28), C.muted); });
  reveal(eo(seg(lt, 5.2, 0.7)), () => pill('the next chunk is prepared while the GPU works', W / 2, 1500, C.ok, { align: 'center' }));
}, ['Transcribe']);

add(7.4, 'Meanwhile, two free checks.', 'A second download of the same episode, and a pass over the audio itself. Both run while transcription is busy.', (lt) => {
  // Second download: two copies, differing where ads were inserted.
  const y = 640, h = 56, p1 = eo(seg(lt, 0.1, 0.7));
  reveal(p1, () => {
    text('Second download', COL_X, y - 24, font(700, 30), C.fg); text('two copies disagree where ads were inserted', COL_X + COL_W, y - 24, font(400, 24), C.muted, 'right');
    tape(COL_X, y, COL_W, h, { ads: [] }); text('copy A', COL_X - 8, y + h / 2 + 8, font(500, 22), C.muted, 'right');
    tape(COL_X, y + h + 20, COL_W, h, { ads: [] }); text('copy B', COL_X - 8, y + h + 20 + h / 2 + 8, font(500, 22), C.muted, 'right');
  });
  const pd = eo(seg(lt, 1.2, 0.8));
  reveal(pd, () => { for (const [a, b] of ADS) { const ax = COL_X + a * COL_W, aw = (b - a) * COL_W; fillRR(ax, y + h + 20, aw, h, 0, 'rgba(192,132,252,0.55)'); strokeRR(ax - 2, y - 6, aw + 4, 2 * h + 32, 8, C.purple, 2); } });
  reveal(eo(seg(lt, 2.0, 0.6)), () => pill('differs here', COL_X + 0.515 * COL_W, y + 2 * h + 44, C.purple, { align: 'center', size: 24 }));
  // Audio analysis: a loudness trace with steps at the inserted ads, plus a cue sound.
  const ay = 1000, ah = 220, p2 = eo(seg(lt, 2.8, 0.7));
  reveal(p2, () => {
    text('Audio analysis', COL_X, ay - 24, font(700, 30), C.fg); text('loudness jumps and the show\'s own cue sounds', COL_X + COL_W, ay - 24, font(400, 24), C.muted, 'right');
    fillRR(COL_X, ay, COL_W, ah, 18, C.card);
    const sweep = seg(lt, 3.2, 2.4); ctx.save(); rr(COL_X, ay, COL_W * sweep, ah, 18); ctx.clip();
    ctx.strokeStyle = C.primary; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i <= COL_W; i += 4) { const f = i / COL_W; const inAd = ADS.some(([a, b]) => f >= a && f < b); const base = inAd ? 0.32 : 0.6; const yy = ay + ah * (base + 0.05 * Math.sin(i * 0.21) * Math.sin(i * 0.07)); if (i === 0) ctx.moveTo(COL_X + i, yy); else ctx.lineTo(COL_X + i, yy); }
    ctx.stroke(); ctx.restore();
    for (const [a, b] of ADS) for (const f of [a, b]) if (f > 0 && f < 1 && f <= sweep) { ctx.fillStyle = C.warn; ctx.fillRect(COL_X + f * COL_W - 2, ay + 10, 4, ah - 20); }
  });
  reveal(eo(seg(lt, 5.0, 0.6)), () => pillRow([['loudness step', C.warn, 1], ['transition pair', C.warn, 1], ['cue template match', C.warn, 1]], ay + ah + 36, 20, 24));
  text('Nothing is cut yet. Both become hints for the next stage.', W / 2, 1400, font(400, 30), C.muted, 'center', eo(seg(lt, 5.8, 0.7)));
}, ['Second download', 'Audio analysis']);

add(6.8, 'Detect ads, part one: known ads first.', 'Fingerprints match the exact audio of an ad heard before. Learned scripts match the words. Both cost nothing and run before any model call.', (lt) => {
  const y = 740, h = 96;
  const pf = eo(seg(lt, 1.0, 0.8)), ps = eo(seg(lt, 2.6, 0.8));
  // Fingerprint match lands on the pre-roll; learned script lands on the post-roll.
  tape(COL_X, y, COL_W, h, { adColor: C.purple, glow: 1, ads: [[...ADS[0], { alpha: pf, glow: pf * (1 - seg(lt, 2.2, 0.5)) }], [...ADS[2], { alpha: ps, glow: ps * (1 - seg(lt, 3.8, 0.5)) }]] });
  reveal(pf, () => { const cx = COL_X + 0.035 * COL_W + 40; arrow(cx, y - 80, cx - 20, y - 14, C.purple, 1, 3); pill('acoustic fingerprint', cx - 40, y - 150, C.purple, { size: 24 }); text('this exact audio was an ad in an earlier episode', cx - 40, y - 180, font(400, 24), C.muted); }, 10);
  reveal(ps, () => { const cx = COL_X + 0.965 * COL_W - 40; arrow(cx, y + h + 80, cx + 20, y + h + 14, C.purple, 1, 3); pill('learned script', cx + 40, y + h + 110, C.purple, { size: 24, align: 'right' }); text('"use code SHOW for twenty percent off"', cx + 40, y + h + 190, font(400, 24), C.muted, 'right'); }, 10);
  reveal(eo(seg(lt, 4.4, 0.7)), () => {
    text('Patterns are scoped to this show, its network, or every show.', W / 2, 1160, font(400, 28), C.muted, 'center');
    pillRow([['this show', C.primary, 1], ['network', C.primary, 1], ['global', C.primary, 1], ['community', C.teal, 1]], 1200, 20, 24);
  });
  note('One you confirmed always cuts. One learned on its own still answers to the gate.', 1340, eo(seg(lt, 5.4, 0.7)), C.muted, 28);
}, ['Detect ads']);

add(8.4, 'Detect ads, part two: the model reads the transcript.', 'In overlapping windows, with every free match as a hint. Any LLM provider, or a System One endpoint. The one paid call.', (lt) => {
  const y = 700, h = 96;
  // Windows sweep the tape; candidates appear once a window has passed them.
  const sweep = seg(lt, 0.8, 4.2), nWin = 5, winW = 0.28, step = (1 - winW) / (nWin - 1);
  const found = ADS.map(([a, b]) => clamp01((sweep * (1 + winW) - b) / 0.08));
  tape(COL_X, y, COL_W, h, { ads: ADS.map((ad, i) => [...ad, { alpha: found[i] }]) });
  for (let i = 0; i < nWin; i++) {
    const wx = i * step, active = sweep >= wx * 0.9 && sweep < (wx + winW) * 1.05;
    const col = active ? C.primary : sweep > wx ? C.dim : C.border;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = active ? 4 : 2; ctx.setLineDash(active ? [] : [8, 8]);
    rr(COL_X + wx * COL_W, y - 14 - (i % 2) * 22, winW * COL_W, h + 28 + (i % 2) * 44, 12); ctx.stroke(); ctx.restore();
  }
  text('10 minute windows, 3 minutes of overlap, duplicates merged', W / 2, y + h + 70, font(400, 26), C.muted, 'center', eo(seg(lt, 0.6, 0.6)));
  // Confidence tags on found candidates.
  [['96%', 0.035], ['84%', 0.515], ['91%', 0.965]].forEach(([c, f], i) => reveal(found[i], () => text(c, COL_X + f * COL_W, y - 34, font(700, 26), C.ad, 'center'), 8));
  // The model box with the hints feeding in.
  const my = 940, pm = eo(seg(lt, 0.2, 0.7));
  reveal(pm, () => {
    fillRR(COL_X, my, COL_W, 200, 24, C.card); strokeRR(COL_X, my, COL_W, 200, 24, C.warn, 2);
    text('Detection model', COL_X + 34, my + 56, font(700, 32), C.fg); pill('paid', COL_X + COL_W - 34, my + 30, C.warn, { align: 'right', size: 24 });
    text('reads each window of transcript and returns ad spans with a confidence and a category', COL_X + 34, my + 100, font(400, 24), C.muted);
    pillRow([['Claude', C.dim, 1], ['OpenAI', C.dim, 1], ['Ollama', C.dim, 1], ['OpenRouter', C.dim, 1], ['System One', C.dim, 1]], my + 134, 14, 22);
  });
  reveal(eo(seg(lt, 1.4, 0.6)), () => { text('hints: fingerprint and script matches, differential regions, audio signals, your past corrections', W / 2, my + 250, font(400, 24), C.purple, 'center'); arrow(W / 2, my + 268, W / 2, my + 212, C.purple, 1, 2); });
  // Audio enforcement: a signal stretches one edge to the real transition.
  const pe = eo(seg(lt, 5.6, 0.9));
  reveal(pe, () => { const ex = COL_X + 0.57 * COL_W; ctx.fillStyle = C.warn; ctx.fillRect(ex - 2 + pe * 14, y, 4, h); arrow(ex + 14, y - 96, ex + 14, y - 8, C.warn, 1, 3); text('audio enforcement: a loudness step pushes the edge to the real transition', W / 2, y - 112, font(400, 26), C.warn, 'center'); });
  note('Categories too: sponsor, cross-promo, self-promo, intro, outro. Each can be cut, beeped, kept or marked.', 1460, eo(seg(lt, 6.6, 0.7)), C.muted, 26);
}, ['Detect ads']);

add(7.6, 'Validate.', 'Confidence, length, position and your past corrections. 80% and up is cut, 50 to 79 is held for your review, below 50 is dropped.', (lt) => {
  const y = 1030, h = 40;
  const zones = [[0, 0.5, C.dim, 'reject'], [0.5, 0.8, C.warn, 'hold for review'], [0.8, 1, C.ok, 'cut']];
  reveal(eo(seg(lt, 0.1, 0.8)), () => {
    zones.forEach(([a, b, col, lab]) => { fillRR(COL_X + a * COL_W + 3, y, (b - a) * COL_W - 6, h, 10, col); text(lab, COL_X + (a + b) / 2 * COL_W, y + h + 42, font(500, 26), col, 'center'); });
    [0, 50, 80, 100].forEach((v) => text(`${v}%`, COL_X + v / 100 * COL_W, y - 62, font(500, 24), C.muted, v === 0 ? 'left' : v === 100 ? 'right' : 'center'));
  });
  // Candidates drop from the tape onto the gate; the fourth is a low-confidence extra.
  const ty = 700; tape(COL_X, ty, COL_W, 72, { adAlpha: 0.9, ads: [[0, 0.07], [0.46, 0.57], [0.62, 0.66], [0.93, 1]] });
  const cands = [[0.035, 0.96, 'cut'], [0.515, 0.84, 'cut'], [0.64, 0.63, 'held'], [0.965, 0.31, 'rejected']];
  cands.forEach(([tp, conf, res], i) => {
    const p = eio(seg(lt, 1.2 + i * 1.1, 0.9)); if (p <= 0) return;
    const sx = COL_X + tp * COL_W, sy = ty + 36, ex = COL_X + conf * COL_W, ey = y + h / 2;
    const px = lerp(sx, ex, p), py = lerp(sy, ey, p) - Math.sin(p * Math.PI) * 80;
    const col = res === 'cut' ? C.ok : res === 'held' ? C.warn : C.dim;
    ctx.save(); ctx.fillStyle = p >= 1 ? col : C.ad; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    text(`${Math.round(conf * 100)}%`, px, py - 36, font(700, 28), p >= 1 ? col : C.fg, 'center');
    reveal(eo(seg(lt, 2.1 + i * 1.1, 0.5)), () => pill(res, COL_X + 60 + i * 215, 1240, col, { align: 'center' }), 12);
  });
  note('Also checked: too short or too long, a typical ad position, sponsor words in the text, and merges of ads with tiny gaps.', 1380, eo(seg(lt, 5.4, 0.7)), C.muted, 26);
  note('A correction you confirmed before always wins over the score.', 1480, eo(seg(lt, 6.0, 0.7)), C.muted, 26);
}, ['Validate']);

add(7.4, 'Boundary review.', 'Opt-in. A second model call reads 60 seconds of transcript on either side of each cut and confirms it, adjusts an edge, or rejects it.', (lt) => {
  const y = 760, h = 110, cx = W / 2;
  // One candidate, zoomed, with its context brackets.
  const adW = 260, adjust = eio(seg(lt, 2.8, 0.9)) * 44;
  const p0 = eo(seg(lt, 0.1, 0.7));
  reveal(p0, () => {
    fillRR(COL_X, y, COL_W, h, 12, '#2B4652');
    fillRR(cx - adW / 2 - adjust, y, adW + adjust, h, 0, C.ad);
    text('candidate ad', cx, y - 24, font(700, 26), C.ad, 'center');
    [[COL_X + 20, cx - adW / 2 - 30, '60 s before'], [cx + adW / 2 + 30, COL_X + COL_W - 20, '60 s after']].forEach(([a, b, lab]) => {
      ctx.strokeStyle = C.purple; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(a, y + h + 24); ctx.lineTo(a, y + h + 40); ctx.lineTo(b, y + h + 40); ctx.lineTo(b, y + h + 24); ctx.stroke();
      text(lab, (a + b) / 2, y + h + 76, font(500, 24), C.purple, 'center');
    });
  });
  // Transcript snippets that the reviewer sees.
  const snippets = [['before', 'so that is the whole story on the migration, and we will'], ['', 'be right back. This episode is brought to you by Acme.'], ['after', 'Acme dot com slash show. And we are back, so the migration']];
  snippets.forEach(([lab, s], i) => reveal(eo(seg(lt, 0.8 + i * 0.3, 0.5)), () => { const yy = 1010 + i * 66; fillRR(COL_X, yy - 40, COL_W, 56, 12, i === 1 ? 'rgba(239,95,93,0.12)' : C.card); text(s, COL_X + 24, yy, font(400, 26), i === 1 ? C.fg : C.muted); }));
  reveal(eo(seg(lt, 2.8, 0.6)), () => { text('"the read starts two words earlier"', cx - adW / 2 - 60, y - 70, font(500, 26), C.purple, 'center'); arrow(cx - adW / 2 - 60, y - 56, cx - adW / 2 - adjust + 6, y - 6, C.purple, 1, 3); });
  pillRow([['confirm', C.ok, eo(seg(lt, 4.0, 0.5))], ['adjust', C.purple, eo(seg(lt, 4.3, 0.5))], ['reject', C.muted, eo(seg(lt, 4.6, 0.5))]], 1210, 24, 28);
  note('Near-miss rejections from the gate get a second look here and can come back.', 1340, eo(seg(lt, 5.4, 0.7)), C.muted, 26);
  note('Then two sweeps snap a start to deep silence and push an end past a stranded call to action.', 1400, eo(seg(lt, 6.0, 0.7)), C.muted, 26);
}, ['Boundary review']);

add(6.6, 'Cut audio.', 'FFmpeg removes the accepted spans and drops a short audio marker where each one was. Beeped or kept categories stay in.', (lt) => {
  const y = 800, h = 110;
  const glow = seg(lt, 0.3, 0.6) * (1 - seg(lt, 1.6, 0.6)), cut = eio(seg(lt, 1.6, 1.6));
  const { cw, marks } = tape(COL_X, y, COL_W, h, { glow, cut, markers: eo(seg(lt, 3.4, 0.6)) });
  text(cutLabel(cut), COL_X + cw, y - 32, font(700, 36), cut > 0.99 ? C.ok : C.fg, 'right');
  if (cut > 0 && cut < 1) reveal(1 - cut, () => ADS.forEach(([a, b], i) => fillRR(COL_X + a * COL_W, y + h + 60 + cut * 500 + i * 30, (b - a) * COL_W, 40, 8, C.ad)));
  reveal(eo(seg(lt, 3.8, 0.7)), () => { const lx = marks[1]; arrow(lx, y + h + 140, lx, y + h + 30, C.teal, 1, 3); text('a short tone marks the cut', lx + 18, y + h + 170, font(500, 28), C.teal, 'left'); });
  reveal(eo(seg(lt, 4.6, 0.7)), () => { pill('original kept on disk', W / 2, 1230, C.muted, { align: 'center' }); text('so any cut can be undone or redrawn later without a new model call', W / 2, 1330, font(400, 28), C.muted, 'center'); });
}, ['Cut audio']);

add(9.0, 'Verify pass.', 'The cut file goes through the pipeline a second time: transcribe, analyze, detect, review, re-cut. It catches what the first pass missed.', (lt) => {
  const y = 700, h = 96, vw = COL_W * 0.7, vx = (W - vw) / 2;
  const cue = { retranscribe: 0.6, analyze: 1.9, detect: 3.2, review: 4.6, recut: 6.0 };
  const found = eo(seg(lt, cue.detect + 0.5, 0.5)), recut = eio(seg(lt, cue.recut + 0.4, 1.0));
  tape(vx, y, vw, h, { ads: [[0.33, 0.37]], adAlpha: found, cut: recut, markers: 1, glow: found * (1 - seg(lt, cue.recut, 0.5)), wave: seg(lt, cue.retranscribe, 0.5) * (1 - seg(lt, cue.analyze, 0.5)), t: lt });
  text('missed one', vx + 0.35 * vw, y - 30, font(700, 28), C.ad, 'center', found * (1 - seg(lt, cue.recut + 0.6, 0.5)));
  text(cutLabel(1), vx + vw, y - 30, font(500, 28), C.ok, 'right', 1 - found * (1 - seg(lt, cue.recut + 0.6, 0.5)));
  const steps = [['Re-transcribe the cut file', cue.retranscribe], ['Audio analysis again', cue.analyze], ['Detect: what does not belong?', cue.detect], ['Boundary review again', cue.review], ['Re-cut the first output', cue.recut]];
  checklist(COL_X + 80, 920, steps.map(([s]) => s), (i) => seg(lt, steps[i][1], 1.0));
  note('A miss that overlaps nothing goes through its own confidence check, then cuts, holds, or is dropped with a log line.', 1400, eo(seg(lt, 7.2, 0.7)), C.muted, 26);
}, ['Verify pass']);

add(6.0, 'Transcript and chapters.', 'Rebuilt against the new, shorter timeline, so every timestamp in the served file lines up with the cut audio.', (lt) => {
  const rows = [['00:28:41', '00:28:41', 'ad removed', true], ['00:29:03', '00:21:53', 'and now back to it, so the first thing we noticed'], ['00:41:10', '00:34:00', 'the second half of the show starts with questions']];
  rows.forEach(([a, b, s, gone], i) => reveal(eo(seg(lt, 0.2 + i * 0.4, 0.6)), () => {
    const yy = 720 + i * 90; fillRR(COL_X, yy - 48, COL_W, 70, 14, gone ? 'rgba(239,95,93,0.10)' : C.card);
    text(a, COL_X + 24, yy, font(500, 26), gone ? C.ad : C.dim); if (!gone) { arrow(COL_X + 150, yy - 10, COL_X + 200, yy - 10, C.ok, eo(seg(lt, 1.8 + i * 0.3, 0.5)), 2); text(b, COL_X + 216, yy, font(700, 26), C.ok, 'left', eo(seg(lt, 2.0 + i * 0.3, 0.5))); }
    text(gone ? 'ad removed, line dropped' : s, COL_X + 360, yy, font(400, 24), gone ? C.ad : C.muted);
  }));
  reveal(eo(seg(lt, 3.0, 0.7)), () => {
    text('Chapters', COL_X, 1050, font(700, 30), C.fg);
    [['00:00', 'What changed in the release'], ['14:20', 'Why it matters for self-hosters'], ['34:00', 'Listener questions']].forEach(([t, s], i) => { const yy = 1100 + i * 60; text(t, COL_X + 10, yy, font(500, 26), C.purple); text(s, COL_X + 110, yy, font(400, 26), C.muted); });
  });
  pillRow([['VTT and JSON transcript', C.primary, eo(seg(lt, 4.0, 0.5))], ['chapters JSON and ID3', C.purple, eo(seg(lt, 4.3, 0.5))]], 1320, 24, 24);
}, ['Transcript, chapters']);

add(6.4, 'Publish feed.', 'The rewritten RSS points at the processed file. Your app sees a normal podcast, just shorter.', (lt) => {
  const px = 190, py = 620, pw = 700, ph = 900;

}, ['Publish feed']);

  const cx = W / 2, cy = 1060;
  [[150, 'this show', 0.8], [290, 'its network', 2.2], [430, 'global', 3.6]].forEach(([r, lab, at], i) => { const p = eo(seg(lt, at, 0.9)); reveal(p, () => {
    const rad = r * (0.9 + 0.1 * p); ctx.strokeStyle = C.primary; ctx.lineWidth = 3; ctx.setLineDash(i === 0 ? [] : [10, 12]); ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    text(lab, cx, cy - rad - 16, font(500, 28), C.primary, 'center'); }); });
  reveal(eo(seg(lt, 0.1, 0.7)), () => {
    fillRR(cx - 220, cy - 70, 440, 140, 24, C.card); strokeRR(cx - 220, cy - 70, 440, 140, 24, C.border, 1.5); text('"use code SHOW for twenty..."', cx, cy - 18, font(500, 26), C.fg, 'center');

  });
  reveal(eo(seg(lt, 1.6, 0.5)), () => pill('pattern saved', cx, cy + 90, C.purple, { align: 'center', size: 24 }), 10);
  note('"Not an ad" is remembered too, so the same false positive is excluded next time.', 1560, eo(seg(lt, 4.4, 0.7)), C.muted, 28);

add(6.2, 'Nothing fails silently.', 'A failed model call still publishes what the free evidence found. An unsure cut waits for you.', (lt) => {
  const items = [['Model call fails', 'the free evidence still cuts; the episode is flagged and one retry is queued', C.warn], ['Endpoint offline', 'the episode parks in the offline queue and retries when it is back', C.warn], ['Cut is uncertain', 'it is held, not applied, until you confirm it', C.ad]];
  items.forEach(([t, s, col], i) => { const p = eo(seg(lt, 0.2 + i * 0.7, 0.7)); card(COL_X, 700 + i * 230 + (1 - p) * 30, COL_W, 180, t, s, col, p); });
  reveal(eo(seg(lt, 3.2, 0.7)), () => { pill('Held for review', W / 2, 1420, C.warn, { align: 'center', size: 28 }); text('shows up on the episode page and in Patterns, with one-tap approve or dismiss', W / 2, 1520, font(400, 28), C.muted, 'center'); });
});

add(4.6, '', '', (lt, d) => splash(lt, d, () => {
  text('Self-hosted. Open source.', 0, 90, font(700, 72), C.fg, 'center');

}));

window.W = OUT_W; window.H = OUT_H; window.FPS = FPS;
window.total = scenes.reduce((a, s) => a + s.dur, 0);
// Midpoint of each scene, the default preview set.
window.sceneMids = scenes.map((s, i) => scenes.slice(0, i).reduce((a, x) => a + x.dur, 0) + s.dur / 2);
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, OUT_W, OUT_H);
  let acc = 0, idx = 0; for (; idx < scenes.length - 1 && t >= acc + scenes[idx].dur; idx++) acc += scenes[idx].dur;
  const sc = scenes[idx], lt = Math.min(t - acc, sc.dur), last = idx === scenes.length - 1;
  const fade = last ? seg(lt, 0, 0.35) : envelope(lt, sc.dur, 0, 0.35, 0.35);
  reveal(fade, () => { if (LANDSCAPE && sc.head) { ctx.translate(LS.x, 40); ctx.scale(LS.scale, LS.scale); ctx.translate(0, -BOX.top); } sc.draw(lt, sc.dur); });
  if (sc.head) caption(sc.head, sc.sub, envelope(lt, sc.dur, 0.15, 0.45, 0.35));
  if (sc.stage) rail(sc.stage, fade);
};
