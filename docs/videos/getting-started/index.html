// Bezel, clip and logical scale; ink colors the status bar text.

// Page a slides left and dims as page b slides in over it; p runs 0..1.

}
// Touch indicator: a soft ring that expands and fades from t0.

// ---------- glyphs ----------
function stroke(col, lw = 1.8) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }

// ---------- shared pieces ----------
function btn(x, y, w, h, label, kind = 'primary') {

}

}
function appHeader(y = 24) {

function appBg() { ctx.fillStyle = T.bg; ctx.fillRect(0, 0, LW, LH); }

  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = s * 0.035; ctx.beginPath(); ctx.arc(x + s * 0.68, y + s * 0.36, s * 0.2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.moveTo(x + s * 0.68, y + s * 0.18); ctx.lineTo(x + s * 0.86, y + s * 0.36); ctx.lineTo(x + s * 0.68, y + s * 0.54); ctx.lineTo(x + s * 0.5, y + s * 0.36); ctx.fill();

}
// Cover badge colors, from src/artwork_watermark.py.
const BADGE = { ring: '#1CE783', chip: '#0F1016' };
// The watermark chip: near-black rounded square, green ring and halo, waveform mark, bottom-right of the cover.
function badge(x, y, s) {
  const c = s * 0.18, bx = x + s - s * 0.05 - c, by = y + s - s * 0.05 - c;
  ctx.save(); ctx.shadowColor = BADGE.ring; ctx.shadowBlur = c * 0.45; fillRR(bx, by, c, c, c * 0.26, BADGE.chip); ctx.restore();

  return [bx + c / 2, by + c / 2, c];
}

// ---------- home screen ----------
const GLYPHS = ['#4F8EF7', '#F28B50', '#4CC38A', '#B07CF5', '#EF6F7E', '#E7C35A', '#5CC6D6', '#8A93A6'];
const GENERIC = [['Tools', 0], ['Games', 1], ['Social', 2], ['Shop', 3], ['Travel', 4], null, null, ['Health', 5], ['Notes', 6], ['Files', 7], ['Radio', 0], ['Reader', 3]];
const slot = (i) => [20 + (i % 4) * 86, 64 + Math.floor(i / 4) * 92];
// Podcast app mark centered at (cx, cy), drawn with the current stroke and fill.
function podGlyph(cx, cy) { ctx.beginPath(); ctx.arc(cx, cy - 4, 6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx, cy - 4, 14, -2.4, -0.74); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy - 4, 14, 3.88, 5.54); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, cy + 19); ctx.stroke(); }
function homeIcon(x, y, kind, ci) {
  fillRR(x, y, 62, 62, 15, kind === 'mp' ? C.bg : kind === 'pod' ? K.acc : GLYPHS[ci]);
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  if (kind === 'mp') { strokeRR(x, y, 62, 62, 15, C.border, 1.5); ctx.drawImage(icon, x + 7, y + 7, 48, 48); }

  ctx.restore();
}
function homeScreen() {

  [x, y] = slot(6); homeIcon(x, y, 'mp', 0); text('MinusPod', x + 31, y + 79, font(400, 13), '#fff', 'center');
  fillRR(12, LH - 96, 336, 82, 26, 'rgba(255,255,255,0.18)');
  [0, 1, 2, 3].forEach((i) => homeIcon(20 + i * 86, LH - 86, 'g', (i * 2 + 1) % 8));
}
const ICON_MP = [slot(6)[0] + 31, slot(6)[1] + 31], ICON_POD = [slot(5)[0] + 31, slot(5)[1] + 31];
// An app window growing out of its icon: from the icon color to bg, with inner(e, mx, my) drawing the icon at the window center.
function launch(p, cx, cy, from, bg, inner) {

}

const launchPod = (e, mx, my) => {

};

  fillRR(14, 188, 332, 40, 6, T.bg); strokeRR(14, 188, 332, 40, 6, typed || shown ? T.primary : T.input, typed ? 2 : 1);
  if (typed) { text(typed, 26, 213, font(400, 14), T.fg); ctx.font = font(400, 14); if (Math.floor(lt * 2) % 2 === 0 && !shown) { ctx.fillStyle = T.primary; ctx.fillRect(28 + ctx.measureText(typed).width, 201, 1.5, 17); } }

    strokeRR(262, 370, 60, 24, 5, T.bad, 1.2); text('Cancel', 292, 387, font(500, 13), T.bad, 'center'); ctx.restore();
  }
  for (const [i, n] of ['Queue control', 'Processing queue'].entries()) { const y = (idle ? 304 : 416) + i * 56; fillRR(14, y, 332, 46, 10, T.card); strokeRR(14, y, 332, 46, 10, T.border, 1); text(n, 26, y + 28, font(700, 15), T.fg); icoCaret(328, y + 23, T.mut); }
  ctx.restore();
  if (!idle) {
    ctx.fillStyle = '#1E2227'; ctx.fillRect(0, 0, LW, 52); ctx.fillStyle = T.border; ctx.fillRect(0, 51, LW, 1);
    ctx.fillStyle = T.ok; ctx.beginPath(); ctx.arc(16, 38, 4, 0, Math.PI * 2); ctx.fill();
    text(stage, 28, 43, font(500, 13), T.warn); fillRR(232, 36, 54, 4, 2, T.card); fillRR(232, 36, 54 * pct / 100, 4, 2, T.warn);
    text(`${Math.round(pct)}%`, 316, 43, font(400, 13), T.mut, 'right'); icoCaret(340, 38, T.mut);
  }
}
const NOTE_TAP = [180, 80];
function detailScreen(rows) {

function notification(p) {
  if (p <= 0) return; const y = lerp(-110, 28, eo(p)), x = 8;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6; fillRR(x, y, 344, 98, 18, '#3B4048'); ctx.restore();
  ctx.save(); ctx.translate(x + 12, y + 12); ctx.scale(0.45, 0.45); homeIcon(0, 0, 'mp', 0); ctx.restore();
  text('MinusPod', x + 48, y + 26, font(500, 13), T.mut); text('now', x + 330, y + 26, font(400, 13), T.mut, 'right');
  text('Episode Processed', x + 14, y + 54, font(700, 14), T.fg); text(SHOW, x + 14, y + 72, font(400, 13), T.mut); text(EPS[0], x + 14, y + 88, font(400, 13), T.mut);
}

// ---------- the podcast app (invented, unnamed) ----------
function kBg() { ctx.fillStyle = K.bg; ctx.fillRect(0, 0, LW, LH); }
function kBar(title, back) { ctx.fillStyle = K.card; ctx.fillRect(0, 0, LW, 72); ctx.fillStyle = K.line; ctx.fillRect(0, 72, LW, 1); if (back) icoChevron(24, 50, K.ink, -1); text(title, back ? 40 : 16, 56, font(700, 18), K.ink); }
function discoverScreen(pasted, pasteP, row, added) {
  kBg(); kBar('Discover');
  fillRR(14, 90, 332, 42, 21, K.card); strokeRR(14, 90, 332, 42, 21, pasted ? K.acc : K.line, pasted ? 2 : 1); icoSearch(36, 111, K.mut);
  if (pasted) text(fit(FEED_URL, font(400, 14), 288), 52, 116, font(400, 14), K.ink); else text('Search or add RSS URL', 52, 116, font(400, 14), K.mut);
  if (pasteP > 0 && !pasted) reveal(pasteP, () => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 8; fillRR(48, 140, 70, 34, 10, K.ink); ctx.restore(); text('Paste', 83, 162, font(500, 14), '#fff', 'center'); }, 6);
  reveal(row, () => {
    fillRR(14, 150, 332, 72, 14, K.card); strokeRR(14, 150, 332, 72, 14, K.line, 1);
    cover(24, 160, 52, 0); badge(24, 160, 52); text(SHOW, 88, 180, font(700, 14), K.ink); text(AUTHOR, 88, 198, font(400, 13), K.mut); text('Technology', 88, 214, font(400, 13), K.mut);
    if (added > 0) { fillRR(308, 172, 30, 30, 15, K.acc); icoCheck(323, 187, '#fff', 0.9, 2.4); } else { strokeRR(308, 172, 30, 30, 15, K.acc, 1.6); icoPlus(323, 187, K.acc, 6, 2); }
  }, 12);
}
const SEARCH_TAP = [60, 111], PASTE_TAP = [83, 157], KROW_TAP = [323, 187];
function showScreen(follow, ring) {
  kBg(); kBar('', true);
  cover(85, 88, 190, 0); const [bx, by, bc] = badge(85, 88, 190);
  if (ring > 0) { for (let k = 0; k < 2; k++) { const p = (ring * 1.5 + k * 0.5) % 1; ctx.save(); ctx.globalAlpha = 0.9 * (1 - p); strokeRR(bx - bc / 2 - 4 - p * 16, by - bc / 2 - 4 - p * 16, bc + 8 + p * 32, bc + 8 + p * 32, bc * 0.26 + 4 + p * 16, BADGE.ring, 3); ctx.restore(); }
    reveal(eo(seg(ring, 0.1, 0.25)), () => { ctx.font = font(500, 13); const w = ctx.measureText('MinusPod badge').width + 20; ctx.fillStyle = K.ink; ctx.beginPath(); ctx.moveTo(bx, by + bc / 2 + 6); ctx.lineTo(bx - 6, by + bc / 2 + 14); ctx.lineTo(bx + 6, by + bc / 2 + 14); ctx.fill(); fillRR(bx - w / 2 - 22, by + bc / 2 + 14, w, 26, 13, K.ink); text('MinusPod badge', bx - 22, by + bc / 2 + 32, font(500, 13), '#fff', 'center'); }, 6); }
  text(SHOW, 14, 338, font(700, 22), K.ink); text(AUTHOR, 14, 360, font(400, 14), K.mut); text('Technology', 14, 380, font(400, 13), K.mut);
  wrap(DESC, font(400, 14), 332).forEach((l, i) => text(l, 14, 410 + i * 20, font(400, 14), K.ink));
  if (follow) { fillRR(14, 460, 332, 44, 22, K.card); strokeRR(14, 460, 332, 44, 22, K.acc, 1.6); icoCheck(125, 482, K.acc, 0.8, 2.2); text('Following', 190, 487, font(700, 15), K.acc, 'center'); }
  else { fillRR(14, 460, 332, 44, 22, K.acc); text('Follow', 180, 487, font(700, 15), '#fff', 'center'); }
}
const FOLLOW_TAP = [180, 482];
function episodesScreen(dl) {
  kBg(); kBar(SHOW, true);
  cover(14, 88, 56, 0); badge(14, 88, 56); text(SHOW, 82, 110, font(700, 15), K.ink); text(AUTHOR, 82, 128, font(400, 13), K.mut);
  fillRR(240, 94, 106, 30, 15, K.card); strokeRR(240, 94, 106, 30, 15, K.acc, 1.4); icoCheck(260, 109, K.acc, 0.7, 2); text('Following', 306, 114, font(500, 13), K.acc, 'center');
  text('Episodes', 14, 172, font(700, 16), K.ink);
  PDUR.forEach((d, i) => {
    const y = 186 + i * 82; fillRR(14, y, 332, 74, 14, K.card); strokeRR(14, y, 332, 74, 14, K.line, 1);
    text(EPS[i], 26, y + 30, font(700, 14), K.ink); text(d, 26, y + 52, font(400, 13), K.mut);
    const cx = 312, cy = y + 37;
    if (i === 0 && dl.state === 'play') { const s = 1 + 0.18 * Math.sin(Math.PI * dl.p); ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fillStyle = K.acc; ctx.fill(); icoPlay(1.5, 0, '#fff', 0.9); ctx.restore(); }
    else { ctx.save(); ctx.strokeStyle = K.line; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      if (i === 0 && dl.state === 'load') { ctx.save(); ctx.strokeStyle = K.acc; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, 17, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * dl.p); ctx.stroke(); ctx.restore(); fillRR(cx - 5, cy - 5, 10, 10, 2, K.acc); }
      else icoDown(cx, cy - 1, K.mut); }
  });
}
const DL_TAP = [312, 223];
function playerScreen(lt) {
  kBg(); kBar('Now playing', true);
  cover(55, 92, 250, 0); badge(55, 92, 250);
  wrap(EPS[0], font(700, 20), 320).forEach((l, i) => text(l, 180, 388 + i * 25, font(700, 20), K.ink, 'center')); text(SHOW, 180, 418, font(400, 14), K.mut, 'center');
  const cur = 842 + lt, total = CUT;
  fillRR(24, 462, 312, 6, 3, K.line); fillRR(24, 462, 312 * cur / total, 6, 3, K.acc); ctx.fillStyle = K.acc; ctx.beginPath(); ctx.arc(24 + 312 * cur / total, 465, 8, 0, Math.PI * 2); ctx.fill();
  text(mmss(cur), 24, 492, font(500, 13), K.mut); text(mmss(CUT), 336, 492, font(700, 13), K.ink, 'right'); text(`was ${mmss(RUN)}`, 336, 510, font(400, 13), K.mut, 'right');
  icoSkip(88, 570, K.ink, '15', true); icoSkip(272, 570, K.ink, '30', false);
  ctx.fillStyle = K.acc; ctx.beginPath(); ctx.arc(180, 570, 34, 0, Math.PI * 2); ctx.fill(); icoPause(180, 570, '#fff', 1.3);
}

// ---------- rail: the five journey steps as chips, the active one filled ----------
function rail(active, alpha) {
  reveal(alpha, () => {
    const size = LANDSCAPE ? 22 : 24, gap = LANDSCAPE ? 10 : 14, widths = RAIL.map((m) => pillWidth(m, size));
    let x = LANDSCAPE ? LS.capX : (W - widths.reduce((a, b) => a + b, 0) - gap * (RAIL.length - 1)) / 2; const y = LANDSCAPE ? 880 : 1740;
    RAIL.forEach((m, i) => { pill(m, x, y, m === active ? C.primary : C.dim, { size, filled: m === active }); x += widths[i] + gap; });
  });
}

// ---------- scenes ----------
add(3, '', '', (lt, d) => splash(lt, d, () => {
  text('Add a podcast. Listen without the ads.', 0, 90, font(700, 46), C.fg, 'center');
  text('Start to finish, on a phone', 0, 160, font(400, 42), C.muted, 'center', eo(seg(lt, 0.6, 0.7)));
}));

// 1. Open the app from the home screen.
add(3, 'Open MinusPod', 'It installs to your home screen as an app.', (lt) => {
  phone(() => { homeScreen(); tap(...ICON_MP, 0.9, lt); const p = seg(lt, 1.2, 0.8); if (p > 0) launch(p, ...ICON_MP, C.bg, T.bg, launchMP); });
}, 'Add');

// 2. Feeds dashboard, tap Add feed.
add(3, 'Start with Add feed', '', (lt) => {
  phone(() => slide(seg(lt, 1.4, 0.6), () => { dashScreen(); tap(...DASH_TAP, 0.9, lt); }, () => addScreen(lt, '', [], 0)));
}, 'Add');

// 3. Search, type, results, add.
add(6, 'Search for a podcast', 'Or paste an RSS or YouTube URL.', (lt) => {
  const q = 'daily tech', n = lt < 0.6 ? 0 : Math.min(q.length, Math.floor((lt - 0.6) / 0.11) + 1), rows = [0, 1, 2].map((i) => eo(seg(lt, 1.9 + i * 0.2, 0.4)));
  const added = seg(lt, 3.7, 0.3);
  phone(() => slide(seg(lt, 4.4, 0.6), () => { addScreen(lt, q.slice(0, n), rows, added); tap(...ADD_TAP, 3.4, lt); }, () => feedScreen({ a: ['Queued', 'purple'], mix: 0 })));
}, 'Add');

// 4. Feed page, the episode goes from Queued to Processing.
add(4.5, 'The feed is added', 'Recent episodes go into the queue.', (lt) => {
  phone(() => feedScreen({ a: ['Queued', 'purple'], b: ['Processing', 'warning'], mix: eio(seg(lt, 1.8, 0.5)) }));
}, 'Add');

// 5. Queue page, stages advance as the bar fills.
add(9, 'Watch it process', 'The queue shows each stage as it runs.', (lt) => {
  phone(() => queueScreen(99 * seg(lt, 0.4, 8.0)));
}, 'Process');

// 6. Notification, then the completed episode and its detected ads.
add(6, 'The ads are cut', 'MinusPod can notify you when the episode is ready.', (lt) => {
  const note = lt < 2.4 ? eo(seg(lt, 0.3, 0.5)) : 1 - eio(seg(lt, 2.4, 0.4));
  const rows = [0, 1, 2].map((i) => eo(seg(lt, 4.4 + i * 0.25, 0.4)));
  const feed = () => feedScreen({ a: ['Completed', 'success'], mix: 0 });
  phone(() => {
    slide(seg(lt, 3.2, 0.6), () => slide(seg(lt, 2.2, 0.5), () => queueScreen(null), feed), () => detailScreen(rows));
    notification(note); tap(...NOTE_TAP, 1.9, lt); tap(...FEEDROW_TAP, 2.9, lt);
  });
}, 'Process');

// 7. Copy the feed URL.
add(4.5, 'Copy your feed URL', 'Each feed gets its own address on your server.', (lt) => {
  const copied = seg(lt, 1.7, 0.3);
  phone(() => { feedScreen({ a: ['Completed', 'success'], mix: 0 }, copied); tap(...COPY_TAP, 1.4, lt);
    reveal(eo(seg(lt, 1.7, 0.3)) * (1 - seg(lt, 3.6, 0.4)), () => { fillRR(236, 212, 110, 24, 12, '#173D2A'); strokeRR(236, 212, 110, 24, 12, T.ok, 1.2); icoCheck(254, 224, T.ok, 0.7, 2); text('Copied', 270, 229, font(500, 13), T.ok); }, 8); });
}, 'Copy URL');

// 8. Paste it into the podcast app.
add(5.5, 'Paste it into your podcast app', 'Any app that accepts an RSS URL works.', (lt) => {
  const pasted = lt > 2.85, rowP = eo(seg(lt, 3.1, 0.5)), added = seg(lt, 4.2, 0.3);
  phone(() => {
    homeScreen(); if (lt < 1.0) tap(...ICON_POD, 0.5, lt);
    else if (lt < 2.0) launch(seg(lt, 1.0, 0.7), ...ICON_POD, K.acc, K.bg, launchPod);
    if (lt >= 1.0) {
      const kApp = () => { discoverScreen(pasted, eo(seg(lt, 2.2, 0.3)) * (1 - seg(lt, 2.85, 0.1)), rowP, added); tap(...SEARCH_TAP, 1.9, lt, K.ink); tap(...PASTE_TAP, 2.6, lt, K.ink); tap(...KROW_TAP, 3.9, lt, K.ink); };
      reveal(seg(lt, 1.7, 0.25), () => slide(seg(lt, 4.6, 0.6), kApp, () => showScreen(false, 0)));
    }
  }, lt < 1.58 ? '#fff' : K.ink);
}, 'Subscribe');

// 9. The show loads with the badge on its cover, then Follow.
add(6, 'It loads like any other podcast', 'Same title and description. The MinusPod badge on the cover marks your copy.', (lt) => {
  phone(() => { showScreen(lt > 4.6, lt > 0.8 && lt < 3.8 ? seg(lt, 0.8, 3.0) : 0); if (lt < 4.6) tap(...FOLLOW_TAP, 4.2, lt, K.ink); }, K.ink);
}, 'Subscribe');

// 10. Download the top episode.
add(4.5, 'Follow and download', '', (lt) => {
  const state = lt < 0.9 ? 'idle' : lt < 2.7 ? 'load' : 'play';
  phone(() => { episodesScreen({ state, p: state === 'play' ? seg(lt, 2.7, 0.5) : seg(lt, 0.9, 1.8) }); tap(...DL_TAP, 0.6, lt, K.ink); }, K.ink);
}, 'Listen');

// 11. Play without the ads.
add(5, 'Play it without the ads', 'The episode is shorter because the ads are gone.', (lt) => {
  phone(() => playerScreen(lt), K.ink);
}, 'Listen');

add(3, '', '', (lt, d) => splash(lt, d, () => {
  text('Your podcasts, minus the ads.', 0, 90, font(700, 60), C.fg, 'center');
  text('Self-hosted. Open source.', 0, 160, font(400, 42), C.muted, 'center', eo(seg(lt, 0.5, 0.6)));
  text('github.com/ttlequals0/MinusPod', 0, 250, font(500, 36), C.teal, 'center', eo(seg(lt, 0.9, 0.6)));
}));

finish((sc, fade) => rail(sc.rail, fade));
