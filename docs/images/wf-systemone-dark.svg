<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="One detection window scored by System One, one yes or no question per line"><title>One detection window scored by System One, one yes or no question per line</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5ABFDD"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EF5F5D" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#999999" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="560" fill="#272B30"/><text x="20" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="start" letter-spacing="0.1em">TRANSCRIPT</text><rect x="20" y="44" width="1140" height="24" rx="6" fill="#272B30" stroke="#34383D" stroke-width="1"/><rect x="20" y="78" width="400" height="24" rx="6" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="36" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#5ABFDD" text-anchor="start">window 1</text><rect x="360" y="106" width="400" height="24" rx="6" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="436" y="122" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#5ABFDD" text-anchor="start">window 2</text><rect x="360" y="74" width="60" height="60" rx="4" fill="#FFB900" fill-opacity="0.28" stroke="#FFB900" stroke-width="1" stroke-dasharray="3 3"/><text x="436" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#FFB900" text-anchor="start">overlap scored twice</text><path d="M 126 102 L 126 170" stroke="#5ABFDD" stroke-width="1.5" fill="none" marker-end="url(#arp)"/><rect x="20" y="170" width="212" height="104" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="36" y="226" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Window</text><text x="36" y="246" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">one request</text><path d="M 233 218 L 251 218" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="252" y="170" width="212" height="104" rx="8" fill="#3E4D54" stroke="#5ABFDD" stroke-width="1"/><text x="268" y="226" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">State</text><text x="268" y="246" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">the whole window, shared</text><path d="M 465 218 L 483 218" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="484" y="170" width="212" height="104" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="500" y="184" width="163" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="581.5" y="198" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">QUESTIONS PER REQUEST</text><text x="500" y="226" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Questions</text><text x="500" y="246" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">one per line, split into batches</text><path d="M 697 218 L 715 218" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="716" y="170" width="212" height="104" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="732" y="226" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Prefill</text><text x="732" y="246" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">per batch, whole window again</text><rect x="494.5" y="282" width="191" height="20" rx="4" fill="#4E5256" stroke="none" stroke-width="0"/><text x="590.0" y="296" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="middle">SAME STATE IN EVERY BATCH</text><rect x="948" y="170" width="212" height="104" rx="8" fill="#4F4C3E" stroke="#FFB900" stroke-width="1" stroke-dasharray="5 4"/><rect x="964" y="184" width="135" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="1031.5" y="198" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">MAX PROMPT TOKENS</text><text x="964" y="226" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Over budget</text><text x="964" y="244" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">split before sending,</text><text x="964" y="260" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">halve on a context error</text><path d="M 822.0 274 C 822.0 302.0, 590 302.0, 590 330" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="836.0" y="306" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="start">yes or no per line</text><rect x="420" y="330" width="340" height="62" rx="8" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="590" y="356" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#5ABFDD" text-anchor="middle">Decision gate</text><text x="590" y="376" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#5ABFDD" text-anchor="middle" opacity="0.85">cuts at 80% confidence by default</text><path d="M 590 392 C 590 416.0, 358.0 416.0, 358.0 440" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="252" y="440" width="212" height="78" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="252" y="440" width="212" height="4" fill="#EF5F5D" rx="2"/><text x="268" y="476" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#EF5F5D" text-anchor="start">Cut</text><text x="268" y="496" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Removed</text><path d="M 590 392 C 590 416.0, 590.0 416.0, 590.0 440" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="484" y="440" width="212" height="78" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="484" y="440" width="212" height="4" fill="#FFB900" rx="2"/><text x="500" y="476" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#FFB900" text-anchor="start">Hold</text><text x="500" y="496" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Waits for a person</text><path d="M 590 392 C 590 416.0, 822.0 416.0, 822.0 440" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="716" y="440" width="212" height="78" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="716" y="440" width="212" height="4" fill="#05DF73" rx="2"/><text x="732" y="476" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#05DF73" text-anchor="start">Keep</text><text x="732" y="496" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Left in by policy</text></svg>