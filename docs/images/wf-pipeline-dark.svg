<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="The standard processing pipeline"><title>The standard processing pipeline</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5ABFDD"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EF5F5D" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#999999" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="880" height="760" fill="#272B30"/><rect x="20" y="20" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="21" width="4" height="52" rx="2" fill="#5ABFDD"/><text x="42" y="43" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">01</text><text x="72" y="43" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Download</text><text x="72" y="61" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Fetch the published file</text><path d="M 440 74 L 440 90" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="90" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="91" width="4" height="52" rx="2" fill="#999999"/><text x="42" y="113" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">02</text><text x="72" y="113" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Transcribe</text><text x="72" y="131" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Speech to timestamped text</text><rect x="748.8" y="107" width="95.19999999999999" height="20" rx="4" fill="#4E5256" stroke="none" stroke-width="0"/><text x="796.4" y="121" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="middle">SLOWEST STEP</text><path d="M 440 144 L 440 161.0 M 232 161.0 L 648 161.0 M 232 161.0 L 232 172 M 648 161.0 L 648 172" stroke="#999999" stroke-width="1.5" fill="none"/><path d="M 232 171 L 232 178" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 648 171 L 648 178" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="178" width="412" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="179" width="4" height="52" rx="2" fill="#999999"/><text x="42" y="201" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">03</text><text x="72" y="201" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Second download</text><text x="72" y="219" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Two copies disagree where ads were inserted</text><rect x="347.2" y="195" width="68.8" height="20" rx="4" fill="#4E5256" stroke="none" stroke-width="0"/><text x="381.59999999999997" y="209" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="middle">PER FEED</text><rect x="448" y="178" width="412" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="448" y="179" width="4" height="52" rx="2" fill="#5ABFDD"/><text x="470" y="201" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">04</text><text x="500" y="201" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Audio analysis</text><text x="500" y="219" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Loudness jumps and the show's own cue sounds</text><path d="M 232 232 L 232 249.0 M 648 232 L 648 249.0 M 232 249.0 L 648 249.0 M 440 249.0 L 440 260" stroke="#999999" stroke-width="1.5" fill="none"/><path d="M 440 259 L 440 266" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="266" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="267" width="4" height="52" rx="2" fill="#FFB900"/><text x="42" y="289" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">05</text><text x="72" y="289" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Detect ads</text><text x="72" y="307" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Fingerprints and learned scripts first, then the model reads the transcript</text><rect x="801.6" y="283" width="42.4" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="822.8000000000001" y="297" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">PAID</text><path d="M 440 320 L 440 336" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="336" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="337" width="4" height="52" rx="2" fill="#05DF73"/><text x="42" y="359" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">06</text><text x="72" y="359" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Validate</text><text x="72" y="377" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Confidence, length, position, and past corrections</text><rect x="801.6" y="353" width="42.4" height="20" rx="4" fill="#30604E" stroke="none" stroke-width="0"/><text x="822.8000000000001" y="367" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#05DF73" text-anchor="middle">FREE</text><path d="M 440 390 L 440 406" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="406" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="407" width="4" height="52" rx="2" fill="#FFB900"/><text x="42" y="429" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">07</text><text x="72" y="429" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Boundary review</text><text x="72" y="447" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">A second opinion on where each cut starts and ends</text><rect x="748.8" y="423" width="95.19999999999999" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="796.4" y="437" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">PAID, OPT-IN</text><path d="M 440 460 L 440 476" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="476" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="477" width="4" height="52" rx="2" fill="#EF5F5D"/><text x="42" y="499" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">08</text><text x="72" y="499" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Cut audio</text><text x="72" y="517" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Remove or replace the accepted spans</text><rect x="775.2" y="493" width="68.8" height="20" rx="4" fill="#5F464A" stroke="none" stroke-width="0"/><text x="809.6" y="507" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#EF5F5D" text-anchor="middle">THE EDIT</text><path d="M 440 530 L 440 546" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="546" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="547" width="4" height="52" rx="2" fill="#FFB900"/><text x="42" y="569" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">09</text><text x="72" y="569" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Verify pass</text><text x="72" y="587" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Re-read the cut file for anything the first pass missed</text><rect x="735.6" y="563" width="108.39999999999999" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="789.8000000000001" y="577" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">PAID, PER FEED</text><path d="M 440 600 L 440 616" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="616" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="617" width="4" height="52" rx="2" fill="#FFB900"/><text x="42" y="639" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">10</text><text x="72" y="639" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Transcript, chapters</text><text x="72" y="657" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Rebuilt against the new, shorter timeline</text><rect x="801.6" y="633" width="42.4" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="822.8000000000001" y="647" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">PAID</text><path d="M 440 670 L 440 686" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="686" width="840" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="687" width="4" height="52" rx="2" fill="#05DF73"/><text x="42" y="709" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">11</text><text x="72" y="709" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Publish feed</text><text x="72" y="727" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">The rewritten RSS points at the processed file</text><rect x="801.6" y="703" width="42.4" height="20" rx="4" fill="#30604E" stroke="none" stroke-width="0"/><text x="822.8000000000001" y="717" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#05DF73" text-anchor="middle">DONE</text></svg>