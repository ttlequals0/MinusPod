<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="What happens when a stage fails"><title>What happens when a stage fails</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5ABFDD"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EF5F5D" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#999999" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="880" height="200" fill="#272B30"/><rect x="20" y="20" width="250" height="52" rx="8" fill="#534F3D" stroke="#FFB900" stroke-width="1"/><text x="40" y="52" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFB900" text-anchor="start">Model call fails</text><path d="M 270 46 L 306 46" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="306" y="20" width="554" height="52" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="326" y="52" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">Publishes any free-evidence cuts, flags the episode, queues one retry</text><rect x="20" y="80" width="250" height="52" rx="8" fill="#534F3D" stroke="#FFB900" stroke-width="1"/><text x="40" y="112" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFB900" text-anchor="start">Endpoint offline</text><path d="M 270 106 L 306 106" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="306" y="80" width="554" height="52" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="326" y="112" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">Opt-in offline queue parks it and re-queues when the endpoint returns</text><rect x="20" y="140" width="250" height="52" rx="8" fill="#534F3D" stroke="#FFB900" stroke-width="1"/><text x="40" y="172" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFB900" text-anchor="start">A cut looks wrong</text><path d="M 270 166 L 306 166" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="306" y="140" width="554" height="52" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="326" y="172" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">It was held, not cut. Approving re-cuts from the original</text></svg>