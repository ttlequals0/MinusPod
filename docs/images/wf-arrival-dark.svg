<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" width="1180" height="360" role="img" aria-label="How episodes enter the processing queue"><title>How episodes enter the processing queue</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5ABFDD"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EF5F5D" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#999999" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="360" fill="#272B30"/><text x="20" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="start" letter-spacing="0.1em">TRIGGERS</text><text x="480" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="start" letter-spacing="0.1em">QUEUE</text><text x="860" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="start" letter-spacing="0.1em">PIPELINE</text><rect x="20" y="50" width="320" height="64" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="38" y="78" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Scheduled poll</text><text x="38" y="98" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">default every 15 minutes</text><path d="M 340 82 C 410.0 82, 410.0 180, 480 180" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="134" width="320" height="64" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="38" y="162" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Publisher announce</text><text x="38" y="182" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">instant</text><rect x="252" y="146" width="72" height="20" rx="4" fill="#4E5256" stroke="none" stroke-width="0"/><text x="288.0" y="160" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="middle">OPTIONAL</text><path d="M 340 166 C 410.0 166, 410.0 180, 480 180" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="218" width="320" height="64" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="38" y="246" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Listener presses play</text><text x="38" y="266" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">on demand</text><path d="M 340 250 C 410.0 250, 410.0 180, 480 180" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="480" y="140" width="220" height="80" rx="8" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="590" y="172" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#5ABFDD" text-anchor="middle">Queue</text><text x="590" y="194" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#5ABFDD" text-anchor="middle" opacity="0.85">one episode at a time</text><path d="M 700 180 L 860 180" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="780" y="172" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle">next in line</text><rect x="860" y="140" width="300" height="80" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="880" y="172" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Pipeline</text><text x="880" y="194" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">runs once, then served from disk</text><rect x="480" y="260" width="680" height="76" rx="8" fill="#4F4C3E" stroke="#FFB900" stroke-width="1" stroke-dasharray="5 4"/><rect x="496" y="272" width="86" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="539.0" y="286" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">ONE RUNNER</text><text x="496" y="304" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Only the leader worker runs episodes. A play request that lands on</text><text x="496" y="322" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">another worker is queued and picked up within 30 s.</text></svg>