<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 444" width="1180" height="444" role="img" aria-label="The YouTube pipeline from discovery through the SponsorBlock wait to the served cut"><title>The YouTube pipeline from discovery through the SponsorBlock wait to the served cut</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5ABFDD"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EF5F5D" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#999999" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="444" fill="#272B30"/><rect x="20" y="20" width="740" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="21" width="4" height="52" rx="2" fill="#5ABFDD"/><text x="42" y="43" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">01</text><text x="72" y="43" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Discover</text><text x="72" y="61" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">playlist, channel or video</text><rect x="686" y="37" width="58" height="20" rx="4" fill="#4E5256" stroke="none" stroke-width="0"/><text x="715.0" y="51" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="middle">YT-DLP</text><rect x="606" y="37" width="72" height="20" rx="4" fill="#415963" stroke="none" stroke-width="0"/><text x="642.0" y="51" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5ABFDD" text-anchor="middle">DATA API</text><rect x="20" y="90" width="740" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="91" width="4" height="52" rx="2" fill="#5ABFDD"/><text x="42" y="113" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">02</text><text x="72" y="113" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Serve</text><text x="72" y="131" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">every episode listed, first play processes</text><rect x="20" y="160" width="740" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="161" width="4" height="52" rx="2" fill="#5ABFDD"/><text x="42" y="183" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">03</text><text x="72" y="183" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Wait</text><text x="72" y="201" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">processing delay, then probes</text><rect x="525" y="177" width="219" height="20" rx="4" fill="none" stroke="#FFB900" stroke-width="1" stroke-dasharray="3 3"/><text x="634.5" y="191" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">SPONSORBLOCK DOWN: WAITS HELD</text><rect x="20" y="230" width="740" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="231" width="4" height="52" rx="2" fill="#EF5F5D"/><text x="42" y="253" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">04</text><text x="72" y="253" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Cut</text><text x="72" y="271" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">marks as given, patterns always run</text><rect x="658" y="247" width="86" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="701.0" y="261" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">LLM ON TOP</text><rect x="501" y="247" width="149" height="20" rx="4" fill="none" stroke="#FFB900" stroke-width="1" stroke-dasharray="3 3"/><text x="575.5" y="261" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">MARKS CHANGE: RECUT</text><rect x="20" y="300" width="740" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="301" width="4" height="52" rx="2" fill="#5ABFDD"/><text x="42" y="323" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">05</text><text x="72" y="323" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Transcript</text><text x="72" y="341" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">captions, creator chapters</text><rect x="20" y="370" width="740" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="20" y="371" width="4" height="52" rx="2" fill="#05DF73"/><text x="42" y="393" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#999999" text-anchor="start">06</text><text x="72" y="393" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Serve the cut</text><text x="72" y="411" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">feed and episode page</text><path d="M 390.0 74 L 390.0 90" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 390.0 144 L 390.0 160" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 390.0 214 L 390.0 230" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 390.0 284 L 390.0 300" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 390.0 354 L 390.0 370" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="820" y="126" width="340" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="820" y="127" width="4" height="52" rx="2" fill="#05DF73"/><text x="842" y="149" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Marks found</text><text x="842" y="167" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">queued</text><rect x="820" y="194" width="340" height="54" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><rect x="820" y="195" width="4" height="52" rx="2" fill="#999999"/><text x="842" y="217" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">No marks</text><text x="842" y="235" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">LLM fallback or watch window</text><path d="M 760 187 C 790.0 187, 790.0 153, 820 153" stroke="#05DF73" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 760 187 C 790.0 187, 790.0 221, 820 221" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="820" y="20" width="340" height="54" rx="8" fill="none" stroke="#34383D" stroke-width="1" stroke-dasharray="5 4"/><text x="842" y="43" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Backfill</text><text x="842" y="61" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">descriptions and times, no download</text><rect x="1058" y="37" width="86" height="20" rx="4" fill="#4E5256" stroke="none" stroke-width="0"/><text x="1101.0" y="51" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="middle">BACKGROUND</text></svg>