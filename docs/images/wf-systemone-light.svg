<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 670" width="1180" height="670" role="img" aria-label="One detection window sent to System One as batched yes or no questions"><title>One detection window sent to System One as batched yes or no questions</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6D7378"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#279BBE"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EA312E" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#6D7378" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="670" fill="#F0F2F4"/><text x="20" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">TRANSCRIPT WINDOWS</text><rect x="20" y="46" width="300" height="28" rx="8" fill="#F0F2F4" stroke="#D3D9DE" stroke-width="1"/><text x="170" y="65" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">full episode transcript</text><text x="105" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">window size</text><path d="M 20 100 L 190 100 M 20 96 L 20 104 M 190 96 L 190 104" stroke="#6D7378" stroke-width="1" fill="none"/><rect x="20" y="110" width="170" height="30" rx="6" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="105" y="13