oke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 390 146 L 358 146 L 358 393 L 368 393" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="408" y="124" width="150.4" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="483.2" y="138" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">questions per request</text><text x="408" y="168" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">the state travels with every batch</text><rect x="370" y="178" width="440" height="130" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="386" y="198" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">BATCH 1</text><text x="556" y="198" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">ONE QUESTION PER SEGMENT</text><rect x="386" y="208" width="150" height="88" rx="6" fill="#E5F3F7" stroke="#279BBE" stroke-width="1"/><text x="400" y="232" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#279BBE" text-anchor="start">State (copy)</text><text x="400" y="252" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">L0001 ... L0148</text><text x="400" y="270" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">whole window</text><rect x="556" y="208" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="570" y="226" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Is line 37 advertising?</text><rect x="556" y="239" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="570" y="257" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Is line 38 advertising?</text><rect x="556" y="270" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="570" y="288" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Is line 39 advertising?</text><rect x="370" y="328" width="440" height="130" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="386" y="348" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">BATCH 2</text><text x="556" y="348" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">ONE QUESTION PER SEGMENT</text><rect x="386" y="358" width="150" height="88" rx="6" fill="#E5F3F7" stroke="#279BBE" stroke-width="1"/><text x="400" y="382" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#279BBE" text-anchor="start">State (copy)</text><text x="400" y="402" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">L0001 ... L0148</text><text x="400" y="420" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">whole window</text><rect x="556" y="358" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="570" y="376" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Is line 40 advertising?</text><rect x="556" y="389" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="570" y="407" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Is line 41 advertising?</text><rect x="556" y="420" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="570" y="438" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Is line 148 advertising?</text><text x="850" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">SERVER</text><path d="M 810 208 L 850 208" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="850" y="178" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="866" y="204" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Prefill: whole window</text><text x="866" y="224" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">window plus the questions of batch 1</text><path d="M 1130 208 L 1146 208" stroke="#6D7378" stroke-width="1.5" fill="none"/><path d="M 810 358 L 850 358" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="850" y="328" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="866" y="354" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Prefill: whole window</text><text x="866" y="374" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">window plus the questions of batch 2</text><path d="M 1130 358 L 1146 358" stroke="#6D7378" stroke-width="1.5" fill="none"/><rect x="850" y="250" width="280" height="66" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><text x="866" y="272" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E17100" text-anchor="start">a server that cannot reuse the prompt</text><text x="866" y="288" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">cache prefills the window again</text><text x="866" y="304" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">for every batch</text><path d="M 1146 208 L 1146 528" stroke="#6D7378" stroke-width="1.5" fill="none"/><text x="1138" y="430" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="end">yes or no per line</text><path d="M 1146 528 L 1132 528" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="850" y="500" width="280" height="56" rx="8" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="990" y="524" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#279BBE" text-anchor="middle">Decision gate</text><text x="990" y="544" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#279BBE" text-anchor="middle" opacity="0.85">cuts at 80% confidence by default</text><path d="M 990 556 C 990 573.0, 894 573.0, 894 590" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="850" y="590" width="88" height="62" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="850" y="590" width="88" height="4" fill="#EA312E" rx="2"/><text x="860" y="616" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#EA312E" text-anchor="start">Cut</text><text x="860" y="636" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#6D7378" text-anchor="start">Removed</text><path d="M 990 556 C 990 573.0, 990 573.0, 990 590" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="946" y="590" width="88" height="62" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="946" y="590" width="88" height="4" fill="#E17100" rx="2"/><text x="956" y="616" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#E17100" text-anchor="start">Hold</text><text x="956" y="636" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#6D7378" text-anchor="start">For review</text><path d="M 990 556 C 990 573.0, 1086 573.0, 1086 590" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="1042" y="590" width="88" height="62" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="1042" y="590" width="88" height="4" fill="#00A63E" rx="2"/><text x="1052" y="616" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#00A63E" text-anchor="start">Keep</text><text x="1052" y="636" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#6D7378" text-anchor="start">Left in by policy</text><rect x="370" y="490" width="440" height="80" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><rect x="386" y="500" width="124.80000000000001" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="448.4" y="514" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">max prompt tokens</text><text x="386" y="540" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">A window over the budget is split before sending.</text><text x="386" y="558" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">A context error retries at half size.</text><path d="M 590 490 L 590 460" stroke="#E17100" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="4 4"/></svg>