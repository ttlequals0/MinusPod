<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" width="1180" height="390" role="img" aria-label="How detection gets cheaper over time"><title>How detection gets cheaper over time</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5ABFDD"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EF5F5D" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#999999" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="390" fill="#272B30"/><text x="20" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="start" letter-spacing="0.1em">THE LOOP</text><rect x="20" y="46" width="258" height="66" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="36" y="74" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Ad detected and cut</text><text x="36" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">by any detection source</text><path d="M 278 79 L 314 79" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="314" y="46" width="258" height="66" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="330" y="74" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Pattern stored</text><text x="330" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">no person in the loop</text><path d="M 572 79 L 608 79" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="608" y="46" width="258" height="66" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="624" y="74" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Corrections refine it</text><text x="624" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">confirm, adjust, or reject</text><path d="M 866 79 L 902 79" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="902" y="46" width="258" height="66" rx="8" fill="#35534B" stroke="#05DF73" stroke-width="1"/><text x="918" y="74" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#05DF73" text-anchor="start">Matched free</text><text x="918" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">next time, before the model</text><path d="M 1160 112 C 1160 150, 1160 150, 590 150 C 20 150, 20 150, 20 112" stroke="#999999" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="590" y="168" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle">the next episode starts here with the pattern already known</text><text x="20" y="206" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="start" letter-spacing="0.1em">PATTERNS WIDEN AS THEY PROVE OUT</text><rect x="20" y="220" width="320" height="56" rx="8" fill="#3E4D54" stroke="#5ABFDD" stroke-width="1"/><text x="36" y="244" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#5ABFDD" text-anchor="start">This show</text><text x="36" y="264" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">where it was first seen</text><path d="M 340 248 L 430 248" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="385" y="240" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle">proves out</text><rect x="430" y="220" width="320" height="56" rx="8" fill="#40535C" stroke="#5ABFDD" stroke-width="1"/><text x="446" y="244" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#5ABFDD" text-anchor="start">This network</text><text x="446" y="264" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">same publisher, other shows</text><path d="M 750 248 L 840 248" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="795" y="240" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle">proves out</text><rect x="840" y="220" width="320" height="56" rx="8" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="856" y="244" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#5ABFDD" text-anchor="start">Everywhere</text><text x="856" y="264" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">national sponsors</text><rect x="20" y="300" width="360" height="76" rx="8" fill="#3E4D54" stroke="#5ABFDD" stroke-width="1" stroke-dasharray="5 4"/><rect x="36" y="312" width="93" height="20" rx="4" fill="#415963" stroke="none" stroke-width="0"/><text x="82.5" y="326" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5ABFDD" text-anchor="middle">PER PATTERN</text><text x="36" y="344" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Every pattern carries its own</text><text x="36" y="362" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">confirmation and false-positive counts.</text><rect x="410" y="300" width="360" height="76" rx="8" fill="#4F4C3E" stroke="#FFB900" stroke-width="1" stroke-dasharray="5 4"/><rect x="426" y="312" width="79" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="465.5" y="326" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">WHAT CUTS</text><text x="426" y="344" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Created or confirmed patterns always cut.</text><text x="426" y="362" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Learned ones follow the feed's category actions.</text><rect x="800" y="300" width="360" height="76" rx="8" fill="#4F4C3E" stroke="#FFB900" stroke-width="1" stroke-dasharray="5 4"/><rect x="816" y="312" width="65" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="848.5" y="326" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">SHARING</text><text x="816" y="344" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Community sync is opt-in both ways.</text><text x="816" y="362" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Nothing local is published unless you submit it.</text></svg>