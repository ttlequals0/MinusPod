<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="How detection gets cheaper over time"><title>How detection gets cheaper over time</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5ABFDD"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EF5F5D" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#999999" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="880" height="250" fill="#272B30"/><rect x="20" y="30" width="196" height="66" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="36" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Ad detected and cut</text><text x="36" y="78" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">by any detection source</text><path d="M 216 63 L 226 63" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="228" y="30" width="196" height="66" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="244" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Pattern stored</text><text x="244" y="78" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">no person in the loop</text><path d="M 424 63 L 434 63" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="436" y="30" width="196" height="66" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="452" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Corrections refine it</text><text x="452" y="78" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">confirm, adjust, or reject</text><path d="M 632 63 L 642 63" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="644" y="30" width="196" height="66" rx="8" fill="#35534B" stroke="#05DF73" stroke-width="1"/><text x="660" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#05DF73" text-anchor="start">Matched free</text><text x="660" y="78" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">next time, before the model</text><path d="M 860 96 C 860 130, 860 130, 440 130 C 20 130, 20 130, 20 96" stroke="#999999" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="20" y="172" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#999999" text-anchor="start" letter-spacing="0.1em">PATTERNS WIDEN AS THEY PROVE OUT</text><rect x="20" y="186" width="264" height="52" rx="8" fill="#3E4D54" stroke="#5ABFDD" stroke-width="1"/><text x="36" y="210" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#5ABFDD" text-anchor="start">This show</text><text x="36" y="228" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">where it was first seen</text><path d="M 284 212 L 306 212" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="308" y="186" width="264" height="52" rx="8" fill="#40535C" stroke="#5ABFDD" stroke-width="1"/><text x="324" y="210" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#5ABFDD" text-anchor="start">This network</text><text x="324" y="228" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">same publisher, other shows</text><path d="M 572 212 L 594 212" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="596" y="186" width="264" height="52" rx="8" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="612" y="210" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#5ABFDD" text-anchor="start">Everywhere</text><text x="612" y="228" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">national sponsors</text></svg>