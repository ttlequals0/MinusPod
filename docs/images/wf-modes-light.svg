<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 550" width="1180" height="550" role="img" aria-label="The five per-feed processing modes"><title>The five per-feed processing modes</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6D7378"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#279BBE"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EA312E" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#6D7378" stroke-width="2" opacity="0.20"/></pattern><clipPath id="clip580_66"><rect x="580" y="66" width="560" height="28" rx="6"/></clipPath><clipPath id="clip580_146"><rect x="580" y="146" width="560" height="28" rx="6"/></clipPath><clipPath id="clip580_226"><rect x="580" y="226" width="560" height="28" rx="6"/></clipPath><clipPath id="clip580_306"><rect x="580" y="306" width="560" height="28" rx="6"/></clipPath><clipPath id="clip580_386"><rect x="580" y="386" width="560" height="28" rx="6"/></clipPath></defs><rect width="1180" height="550" fill="#F0F2F4"/><text x="40" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">MODE, ONE PER FEED</text><text x="580" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">AUDIO IT PRODUCES</text><rect x="20" y="46" width="1140" height="68" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="40" y="74" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Standard</text><text x="40" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Find the ads, cut them out</text><g clip-path="url(#clip580_66)"><rect x="580" y="66" width="45.58139534883721" height="28" fill="#F0F2F4"/><rect x="580" y="66" width="45.58139534883721" height="28" fill="url(#hatchq)"/><line x1="625.5813953488372" y1="66" x2="625.5813953488372" y2="94" stroke="#FFFFFF" stroke-width="2"/><rect x="625.5813953488372" y="66" width="169.30232558139534" height="28" fill="#D4EBF2"/><text x="710.2325581395348" y="84.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Show</text><line x1="794.8837209302326" y1="66" x2="794.8837209302326" y2="94" stroke="#FFFFFF" stroke-width="2"/><rect x="794.8837209302326" y="66" width="71.62790697674419" height="28" fill="#F0F2F4"/><rect x="794.8837209302326" y="66" width="71.62790697674419" height="28" fill="url(#hatchq)"/><line x1="866.5116279069767" y1="66" x2="866.5116279069767" y2="94" stroke="#FFFFFF" stroke-width="2"/><rect x="866.5116279069767" y="66" width="221.3953488372093" height="28" fill="#D4EBF2"/><text x="977.2093023255813" y="84.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Show</text><line x1="1087.906976744186" y1="66" x2="1087.906976744186" y2="94" stroke="#FFFFFF" stroke-width="2"/><rect x="1087.906976744186" y="66" width="52.093023255813954" height="28" fill="#F0F2F4"/><rect x="1087.906976744186" y="66" width="52.093023255813954" height="28" fill="url(#hatchq)"/></g><rect x="580" y="66" width="560" height="28" rx="6" fill="none" stroke="#D3D9DE" stroke-width="1"/><rect x="20" y="126" width="1140" height="68" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="40" y="154" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Keep content only</text><text x="40" y="174" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Mark the show, remove everything else</text><rect x="198.2" y="140" width="100" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="248.2" y="154" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">EXPERIMENTAL</text><g clip-path="url(#clip580_146)"><rect x="580" y="146" width="45.58139534883721" height="28" fill="#F0F2F4"/><rect x="580" y="146" width="45.58139534883721" height="28" fill="url(#hatchq)"/><line x1="625.5813953488372" y1="146" x2="625.5813953488372" y2="174" stroke="#FFFFFF" stroke-width="2"/><rect x="625.5813953488372" y="146" width="169.30232558139534" height="28" fill="#D4EBF2"/><text x="710.2325581395348" y="164.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Marked</text><line x1="794.8837209302326" y1="146" x2="794.8837209302326" y2="174" stroke="#FFFFFF" stroke-width="2"/><rect x="794.8837209302326" y="146" width="71.62790697674419" height="28" fill="#F0F2F4"/><rect x="794.8837209302326" y="146" width="71.62790697674419" height="28" fill="url(#hatchq)"/><line x1="866.5116279069767" y1="146" x2="866.5116279069767" y2="174" stroke="#FFFFFF" stroke-width="2"/><rect x="866.5116279069767" y="146" width="221.3953488372093" height="28" fill="#D4EBF2"/><text x="977.2093023255813" y="164.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Marked</text><line x1="1087.906976744186" y1="146" x2="1087.906976744186" y2="174" stroke="#FFFFFF" stroke-width="2"/><rect x="1087.906976744186" y="146" width="52.093023255813954" height="28" fill="#F0F2F4"/><rect x="1087.906976744186" y="146" width="52.093023255813954" height="28" fill="url(#hatchq)"/></g><rect x="580" y="146" width="560" height="28" rx="6" fill="none" stroke="#D3D9DE" stroke-width="1"/><rect x="20" y="206" width="1140" height="68" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="40" y="234" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Cue-only</text><text x="40" y="254" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Cut on cue pairs and known patterns, no model call</text><rect x="120.8" y="220" width="100" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="170.8" y="234" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">EXPERIMENTAL</text><g clip-path="url(#clip580_226)"><rect x="580" y="226" width="70.0" height="28" fill="#D4EBF2"/><text x="615.0" y="244.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Show</text><line x1="650.0" y1="226" x2="650.0" y2="254" stroke="#FFFFFF" stroke-width="2"/><rect x="650.0" y="226" width="75.83333333333333" height="28" fill="#F0F2F4"/><rect x="650.0" y="226" width="75.83333333333333" height="28" fill="url(#hatchq)"/><text x="687.9166666666666" y="244.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="middle">cue to cue</text><line x1="725.8333333333334" y1="226" x2="725.8333333333334" y2="254" stroke="#FFFFFF" stroke-width="2"/><rect x="725.8333333333334" y="226" width="256.6666666666667" height="28" fill="#D4EBF2"/><text x="854.1666666666667" y="244.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Show</text><line x1="982.5" y1="226" x2="982.5" y2="254" stroke="#FFFFFF" stroke-width="2"/><rect x="982.5" y="226" width="70.0" height="28" fill="#F0F2F4"/><rect x="982.5" y="226" width="70.0" height="28" fill="url(#hatchq)"/><text x="1017.5" y="244.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="middle">cue to cue</text><line x1="1052.5" y1="226" x2="1052.5" y2="254" stroke="#FFFFFF" stroke-width="2"/><rect x="1052.5" y="226" width="87.5" height="28" fill="#D4EBF2"/><text x="1096.25" y="244.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Show</text></g><rect x="580" y="226" width="560" height="28" rx="6" fill="none" stroke="#D3D9DE" stroke-width="1"/><rect x="20" y="286" width="1140" height="68" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="40" y="314" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Skip ad detection</text><text x="40" y="334" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Transcript and chapters only, nothing cut</text><g clip-path="url(#clip580_306)"><rect x="580" y="306" width="560.0" height="28" fill="#D4EBF2"/><text x="860.0" y="324.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Full episode, transcript and chapters added</text></g><rect x="580" y="306" width="560" height="28" rx="6" fill="none" stroke="#D3D9DE" stroke-width="1"/><rect x="20" y="366" width="1140" height="68" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="40" y="394" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Pass-through</text><text x="40" y="414" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Relay the file exactly as published</text><rect x="155.2" y="380" width="128" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="219.2" y="394" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">ALSO PER EPISODE</text><g clip-path="url(#clip580_386)"><rect x="580" y="386" width="560.0" height="28" fill="#D4EBF2"/><text x="860.0" y="404.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">Full episode, untouched</text></g><rect x="580" y="386" width="560" height="28" rx="6" fill="none" stroke="#D3D9DE" stroke-width="1"/><rect x="20" y="454" width="560" height="76" rx="8" fill="#E9F5F8" stroke="#279BBE" stroke-width="1" stroke-dasharray="5 4"/><rect x="36" y="466" width="72" height="20" rx="4" fill="#D4EBF2" stroke="none" stroke-width="0"/><text x="72.0" y="480" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">PER FEED</text><text x="36" y="498" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Changing the mode does not change the published address.</text><text x="36" y="516" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">One episode can also be set to pass-through alone.</text><rect x="600" y="454" width="560" height="76" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><rect x="616" y="466" width="177" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="704.5" y="480" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">KEEP CONTENT SAFETY NET</text><text x="616" y="498" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Marked content must cover 55% of runtime, no cut over</text><text x="616" y="516" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">7 minutes or a quarter of the episode, else standard.</text></svg>