<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 410" width="1180" height="410" role="img" aria-label="What happens when a stage fails"><title>What happens when a stage fails</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6D7378"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#279BBE"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EA312E" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#6D7378" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="410" fill="#F0F2F4"/><text x="20" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">WHAT GOES WRONG</text><text x="440" y="34" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">WHAT MINUSPOD DOES</text><rect x="20" y="46" width="340" height="64" rx="8" fill="#FBEEE0" stroke="#E17100" stroke-width="1"/><text x="40" y="74" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E17100" text-anchor="start">Model call fails</text><text x="40" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">detection stage</text><path d="M 360 78 L 440 78" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="400" y="70" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">then</text><rect x="440" y="46" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="460" y="84" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#272B30" text-anchor="start">Publishes any free-evidence cuts, flags the episode, queues one retry</text><rect x="20" y="126" width="340" height="64" rx="8" fill="#FBEEE0" stroke="#E17100" stroke-width="1"/><text x="40" y="154" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E17100" text-anchor="start">Endpoint offline</text><text x="40" y="174" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">model endpoint unreachable</text><rect x="244" y="138" width="100" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="294.0" y="152" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">OPT-IN QUEUE</text><path d="M 360 158 L 440 158" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="400" y="150" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">if enabled</text><rect x="440" y="126" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="460" y="164" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#272B30" text-anchor="start">Opt-in offline queue parks it and re-queues when the endpoint returns</text><rect x="20" y="206" width="340" height="64" rx="8" fill="#FBEEE0" stroke="#E17100" stroke-width="1"/><text x="40" y="234" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E17100" text-anchor="start">A cut looks wrong</text><text x="40" y="254" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">validator is unsure</text><path d="M 360 238 L 440 238" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="400" y="230" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">instead</text><rect x="440" y="206" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="460" y="244" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#272B30" text-anchor="start">It was held, not cut. Approving re-cuts from the original</text><rect x="20" y="298" width="560" height="76" rx="8" fill="#FDEAEA" stroke="#EA312E" stroke-width="1" stroke-dasharray="5 4"/><rect x="36" y="310" width="100" height="20" rx="4" fill="#FBD6D5" stroke="none" stroke-width="0"/><text x="86.0" y="324" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#EA312E" text-anchor="middle">HARD FAILURE</text><text x="36" y="342" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Nothing fails silently. With no free evidence to fall back</text><text x="36" y="360" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">on, or a bad API key, the run fails and waits on the episode page.</text><rect x="600" y="298" width="560" height="76" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><rect x="616" y="310" width="107" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="669.5" y="324" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">OFFLINE QUEUE</text><text x="616" y="342" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">The offline queue is off until you turn it on.</text><text x="616" y="360" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Without it, an unreachable endpoint retries, then gives up.</text></svg>