<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" width="1180" height="680" role="img" aria-label="The YouTube pipeline: discovery, SponsorBlock gate, cutting and serving"><title>The YouTube pipeline: discovery, SponsorBlock gate, cutting and serving</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6D7378"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#279BBE"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EA312E" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#6D7378" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="680" fill="#F0F2F4"/><text x="20" y="24" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">DISCOVERY</text><text x="440" y="24" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">SERVING</text><text x="940" y="24" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">SIDE PASS</text><rect x="20" y="34" width="380" height="100" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="36" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Discovery</text><text x="36" y="76" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">playlist, channel or video, on the refresh schedule</text><rect x="36" y="86" width="100" height="20" rx="4" fill="#D4EBF2" stroke="none" stroke-width="0"/><text x="86.0" y="100" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">DATA API KEY</text><rect x="144" y="86" width="58" height="20" rx="4" fill="#E2E3E4" stroke="none" stroke-width="0"/><text x="173.0" y="100" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="middle">YT-DLP</text><text x="36" y="124" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">private and deleted hidden</text><path d="M 400 84 L 440 84" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="440" y="34" width="460" height="100" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="456" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Serving</text><text x="456" y="78" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">the feed lists every discovered episode</text><text x="456" y="96" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">first play starts processing,</text><text x="456" y="114" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">the app is told to retry</text><rect x="940" y="34" width="220" height="100" rx="8" fill="none" stroke="#D3D9DE" stroke-width="1" stroke-dasharray="5 4"/><text x="956" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Metadata backfill</text><text x="956" y="78" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">descriptions and publish</text><text x="956" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">times, 10 per pass,</text><text x="956" y="110" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">no download</text><path d="M 670 134 L 670 180" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="180" width="880" height="250" rx="8" fill="#F2F9FB" stroke="#279BBE" stroke-width="1"/><text x="40" y="204" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="start" letter-spacing="0.1em">SPONSORBLOCK GATE</text><rect x="40" y="225" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="56" y="251" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Processing delay</text><text x="56" y="270" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">before first look</text><path d="M 170 255 L 200 255" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="200" y="225" width="220" height="60" rx="8" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="216" y="251" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#279BBE" text-anchor="start">Probe N times</text><text x="216" y="270" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#279BBE" text-anchor="start" opacity="0.85">at the probe interval</text><rect x="200" y="315" width="220" height="92" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><text x="216" y="339" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">SponsorBlock unreachable:</text><text x="216" y="357" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">waits are held, no attempt</text><text x="216" y="375" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">counted, other feeds</text><text x="216" y="393" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">keep running</text><path d="M 310 315 L 310 287" stroke="#E17100" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="4 4"/><rect x="460" y="200" width="200" height="50" rx="8" fill="#E0F4E8" stroke="#00A63E" stroke-width="1"/><text x="476" y="222" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#00A63E" text-anchor="start">Marks found</text><text x="476" y="239" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">first probe that finds them</text><rect x="460" y="290" width="200" height="48" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="476" y="311" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#272B30" text-anchor="start">None after last probe</text><text x="476" y="328" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">marks may arrive later</text><path d="M 420 246 C 440.0 246, 440.0 225, 460 225" stroke="#00A63E" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 420 264 C 440.0 264, 440.0 314, 460 314" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="700" y="262" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="716" y="283" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">LLM fallback</text><text x="716" y="298" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">fallback on</text><rect x="700" y="322" width="180" height="64" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="716" y="343" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Watch window</text><text x="716" y="360" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">fallback off: check each</text><text x="716" y="374" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">interval to the ceiling</text><path d="M 660 314 C 680.0 314, 680.0 284, 700 284" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 660 314 C 680.0 314, 680.0 354, 700 354" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 660 225 L 890 225" stroke="#00A63E" stroke-width="1.5" fill="none"/><path d="M 880 284 L 890 284 M 880 354 L 890 354 M 890 225 L 890 354" stroke="#6D7378" stroke-width="1.5" fill="none"/><path d="M 890 225 L 940 225" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="884" y="217" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="end">queued</text><text x="940" y="172" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">AFTER THE GATE</text><rect x="940" y="180" width="220" height="196" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="940" y="181" width="4" height="194" rx="2" fill="#EA312E"/><text x="960" y="208" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Cutting</text><text x="960" y="230" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">marks cut as given</text><text x="960" y="248" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">learned patterns always run</text><rect x="960" y="260" width="136" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="1028.0" y="274" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">LLM ON TOP, PER FEED</text><rect x="956" y="292" width="188" height="74" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><text x="972" y="316" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">marks change in the</text><text x="972" y="334" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">watch window: recut from</text><text x="972" y="352" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">the retained original</text><path d="M 1050 376 L 1050 406" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="940" y="406" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="960" y="434" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Transcript and chapters</text><text x="960" y="456" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">captions become the</text><text x="960" y="474" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">transcript, Whisper skipped</text><text x="960" y="492" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">creator chapters reused</text><path d="M 1050 516 L 1050 546" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="940" y="546" width="220" height="100" rx="8" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="960" y="580" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#279BBE" text-anchor="start">Served cut</text><text x="960" y="602" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#279BBE" text-anchor="start" opacity="0.85">the feed and episode page</text><rect x="600" y="572" width="290" height="38" rx="8" fill="#F0F1F2" stroke="#6D7378" stroke-width="1" stroke-dasharray="5 4"/><text x="616" y="596" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">rate, submit to SponsorBlock by hand</text><path d="M 890 596 L 940 596" stroke="#6D7378" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/></svg>