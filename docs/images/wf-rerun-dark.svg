nt-weight="500" fill="#5ABFDD" text-anchor="middle">runs</text><rect x="20" y="262" width="1140" height="86" rx="8" fill="#3B4045" stroke="#34383D" stroke-width="1"/><text x="44" y="290" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">Re-detect ads</text><text x="44" y="310" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="start">Iterate on a model or a setting</text><rect x="44" y="320" width="184" height="20" rx="4" fill="#625837" stroke="none" stroke-width="0"/><text x="136.0" y="334" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#FFB900" text-anchor="middle">NEEDS A SAVED TRANSCRIPT</text><rect x="560" y="291" width="92" height="28" rx="4" fill="#272B30" stroke="#34383D" stroke-width="1"/><text x="606.0" y="310" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle">reused</text><rect x="658" y="291" width="92" height="28" rx="4" fill="#272B30" stroke="#34383D" stroke-width="1"/><text x="704.0" y="310" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle">reused</text><rect x="756" y="291" width="92" height="28" rx="4" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="802.0" y="310" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5ABFDD" text-anchor="middle">runs</text><rect x="854" y="291" width="92" height="28" rx="4" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="900.0" y="310" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5ABFDD" text-anchor="middle