="4" fill="none" stroke="#34383D" stroke-width="1" stroke-dasharray="3 3"/><text x="802.0" y="408" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle" opacity="0.7">skipped</text><rect x="854" y="389" width="92" height="28" rx="4" fill="none" stroke="#34383D" stroke-width="1" stroke-dasharray="3 3"/><text x="900.0" y="408" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#999999" text-anchor="middle" opacity="0.7">skipped</text><rect x="952" y="389" width="92" height="28" rx="4" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="998.0" y="408" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5ABFDD" text-anchor="middle">runs</text><rect x="1050" y="389" width="92" height="28" rx="4" fill="#415963" stroke="#5ABFDD" stroke-width="1"/><text x="1096.0" y="408" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5ABFDD" text-anchor="middle">runs</text><rect x="20" y="464" width="370" height="76" rx="8" fill="#3E4D54" stroke="#5ABFDD" stroke-width="1" stroke-dasharray="5 4"/><rect x="36" y="476" width="107" height="20" rx="4" fill="#415963" stroke="none" stroke-width="0"/><text x="89.5" y="490" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5ABFDD" text-anchor="middle">ORIGINAL KEPT</text><text x="36" y="508" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">MinusPod keeps each episode's original</text><text x="36" y="526" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">audio, so a correction is a 