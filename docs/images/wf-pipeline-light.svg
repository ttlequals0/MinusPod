<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 978" width="1180" height="978" role="img" aria-label="The standard processing pipeline"><title>The standard processing pipeline</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6D7378"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#279BBE"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EA312E" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#6D7378" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="1180" height="978" fill="#F0F2F4"/><rect x="20" y="20" width="800" height="174" rx="8" fill="#F6FBFC" stroke="#D3D9DE" stroke-width="1"/><text x="36" y="42" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">FETCH AND TRANSCRIBE</text><rect x="36" y="54" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="55" width="4" height="52" rx="2" fill="#279BBE"/><text x="58" y="77" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">01</text><text x="88" y="77" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Download</text><text x="88" y="95" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Fetch the published file</text><rect x="36" y="124" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="125" width="4" height="52" rx="2" fill="#6D7378"/><text x="58" y="147" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">02</text><text x="88" y="147" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Transcribe</text><text x="88" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Speech to timestamped text</text><rect x="688" y="141" width="100" height="20" rx="4" fill="#E2E3E4" stroke="none" stroke-width="0"/><text x="738.0" y="155" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="middle">SLOWEST STEP</text><rect x="20" y="228" width="800" height="104" rx="8" fill="#F6FBFC" stroke="#D3D9DE" stroke-width="1"/><text x="36" y="250" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">GATHER EVIDENCE, IN PARALLEL</text><rect x="36" y="262" width="372" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="263" width="4" height="52" rx="2" fill="#6D7378"/><text x="58" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">03</text><text x="88" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Second download</text><text x="88" y="303" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Copies disagree where ads sit</text><rect x="320" y="279" width="72" height="20" rx="4" fill="#E2E3E4" stroke="none" stroke-width="0"/><text x="356.0" y="293" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="middle">PER FEED</text><rect x="432" y="262" width="372" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="432" y="263" width="4" height="52" rx="2" fill="#279BBE"/><text x="454" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">04</text><text x="484" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Audio analysis</text><text x="484" y="303" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Loudness jumps and cue sounds</text><rect x="20" y="366" width="800" height="314" rx="8" fill="#F6FBFC" stroke="#D3D9DE" stroke-width="1"/><text x="36" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">DECIDE AND CUT</text><rect x="36" y="400" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="401" width="4" height="52" rx="2" fill="#E17100"/><text x="58" y="423" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">05</text><text x="88" y="423" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Detect ads</text><text x="88" y="441" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Fingerprints and scripts first, then the model reads</text><rect x="744" y="417" width="44" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="766.0" y="431" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">PAID</text><rect x="36" y="470" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="471" width="4" height="52" rx="2" fill="#00A63E"/><text x="58" y="493" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">06</text><text x="88" y="493" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Validate</text><text x="88" y="511" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Confidence, length, position, past corrections</text><rect x="744" y="487" width="44" height="20" rx="4" fill="#CCEDD8" stroke="none" stroke-width="0"/><text x="766.0" y="501" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#00A63E" text-anchor="middle">FREE</text><rect x="36" y="540" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="541" width="4" height="52" rx="2" fill="#E17100"/><text x="58" y="563" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">07</text><text x="88" y="563" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Boundary review</text><text x="88" y="581" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">A second opinion on each cut's edges</text><rect x="688" y="557" width="100" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="738.0" y="571" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">PAID, OPT-IN</text><rect x="36" y="610" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="611" width="4" height="52" rx="2" fill="#EA312E"/><text x="58" y="633" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">08</text><text x="88" y="633" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Cut audio</text><text x="88" y="651" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Remove or replace the accepted spans</text><rect x="716" y="627" width="72" height="20" rx="4" fill="#FBD6D5" stroke="none" stroke-width="0"/><text x="752.0" y="641" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#EA312E" text-anchor="middle">THE EDIT</text><rect x="20" y="714" width="800" height="244" rx="8" fill="#F6FBFC" stroke="#D3D9DE" stroke-width="1"/><text x="36" y="736" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">CHECK AND PUBLISH</text><rect x="36" y="748" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="749" width="4" height="52" rx="2" fill="#E17100"/><text x="58" y="771" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">09</text><text x="88" y="771" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Verify pass</text><text x="88" y="789" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Re-read the cut file for missed ads</text><rect x="674" y="765" width="114" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="731.0" y="779" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">PAID, PER FEED</text><rect x="36" y="818" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="819" width="4" height="52" rx="2" fill="#E17100"/><text x="58" y="841" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">10</text><text x="88" y="841" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Transcript, chapters</text><text x="88" y="859" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">Rebuilt against the shorter timeline</text><rect x="744" y="835" width="44" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="766.0" y="849" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">PAID</text><rect x="36" y="888" width="768" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><rect x="36" y="889" width="4" height="52" rx="2" fill="#00A63E"/><text x="58" y="911" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#6D7378" text-anchor="start">11</text><text x="88" y="911" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Publish feed</text><text x="88" y="929" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">The rewritten RSS points at the processed file</text><rect x="744" y="905" width="44" height="20" rx="4" fill="#CCEDD8" stroke="none" stroke-width="0"/><text x="766.0" y="919" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#00A63E" text-anchor="middle">DONE</text><path d="M 420 194 L 420 228" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="432" y="215" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">transcript ready</text><path d="M 420 332 L 420 366" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="432" y="353" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">hints and signals</text><path d="M 420 680 L 420 714" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="432" y="701" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="start">the cut file</text><path d="M 420 108 L 420 124" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 420 454 L 420 470" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 420 524 L 420 540" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 420 594 L 420 610" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 420 802 L 420 818" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M 420 872 L 420 888" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="860" y="60" width="300" height="94" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><rect x="876" y="72" width="65" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="908.5" y="86" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">CHUNKED</text><text x="876" y="104" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Long episodes transcribe in chunks.</text><text x="876" y="122" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">The next chunk is prepared while</text><text x="876" y="140" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">the GPU works.</text><path d="M 860 90 L 820 90" stroke="#6D7378" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><rect x="860" y="406" width="300" height="94" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><rect x="876" y="418" width="86" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="919.0" y="432" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">PAID STEPS</text><text x="876" y="450" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">Amber badges make an LLM call.</text><text x="876" y="468" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">A hosted Whisper API bills too;</text><text x="876" y="486" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">a local GPU costs only time.</text><path d="M 860 436 L 820 436" stroke="#6D7378" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><rect x="860" y="754" width="300" height="76" rx="8" fill="#FCF1E6" stroke="#E17100" stroke-width="1" stroke-dasharray="5 4"/><rect x="876" y="766" width="58" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="905.0" y="780" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">VERIFY</text><text x="876" y="798" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">The verify pass re-transcribes</text><text x="876" y="816" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#272B30" text-anchor="start">the cut file the same way.</text><path d="M 860 784 L 820 784" stroke="#6D7378" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/></svg>