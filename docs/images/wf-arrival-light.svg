<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="How episodes enter the processing queue"><title>How episodes enter the processing queue</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6D7378"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#279BBE"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EA312E" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#6D7378" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="880" height="250" fill="#F0F2F4"/><rect x="20" y="20" width="250" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="38" y="44" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Scheduled poll</text><text x="38" y="62" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">default every 15 minutes</text><path d="M 270 47 C 310.0 47, 310.0 125, 350 125" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="90" width="250" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="38" y="114" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Publisher announce</text><text x="38" y="132" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">optional, instant</text><path d="M 270 117 C 310.0 117, 310.0 125, 350 125" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="20" y="160" width="250" height="54" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="38" y="184" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Listener presses play</text><text x="38" y="202" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">on demand</text><path d="M 270 187 C 310.0 187, 310.0 125, 350 125" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="350" y="92" width="190" height="66" rx="8" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="445" y="118" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#279BBE" text-anchor="middle">Queue</text><text x="445" y="138" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#279BBE" text-anchor="middle" opacity="0.85">one episode at a time</text><path d="M 540 125 L 610 125" stroke="#6D7378" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="610" y="92" width="250" height="66" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="634" y="118" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#272B30" text-anchor="start">Pipeline</text><text x="634" y="138" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">runs once, then served from disk</text></svg>