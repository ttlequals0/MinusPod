t">Recut audio</text><text x="44" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">After editing the ad list by hand</text><rect x="44" y="398" width="99.2" height="20" rx="4" fill="#F9E3CC" stroke="none" stroke-width="0"/><text x="93.6" y="412" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#E17100" text-anchor="middle">NO MODEL CALL</text><rect x="372" y="369" width="76" height="28" rx="4" fill="#F0F2F4" stroke="#D3D9DE" stroke-width="1"/><text x="410.0" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">reused</text><rect x="454" y="369" width="76" height="28" rx="4" fill="#F0F2F4" stroke="#D3D9DE" stroke-width="1"/><text x="492.0" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">reused</text><rect x="536" y="369" width="76" height="28" rx="4" fill="none" stroke="#D3D9DE" stroke-width="1" stroke-dasharray="3 3"/><text x="574.0" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle" opacity="0.7">skipped</text><rect x="618" y="369" width="76" height="28" rx="4" fill="none" stroke="#D3D9DE" stroke-width="1" stroke-dasharray="3 3"/><text x="656.0" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle" opacity="0.7">skipped</text><rect x="700" y="369" width="76" height="28" rx="4" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="738.0" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">runs</text><rect x="782" y="369" width="76" height="28" rx="4" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="820.0" y="388" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">runs</text><text x="20" y="456" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">MinusPod keeps each episode's original audio by default, so a correction is a re-cut rather than a full re-run.</text></svg>