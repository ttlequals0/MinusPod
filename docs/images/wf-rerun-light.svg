<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 488" width="880" height="488" role="img" aria-label="Where each re-run mode enters the pipeline"><title>Where each re-run mode enters the pipeline</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6D7378"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#279BBE"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#EA312E" stroke-width="2" opacity="0.28"/></pattern><pattern id="hatchq" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#6D7378" stroke-width="2" opacity="0.20"/></pattern></defs><rect width="880" height="488" fill="#F0F2F4"/><text x="20" y="32" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6D7378" text-anchor="start" letter-spacing="0.1em">RE-RUN MODE</text><text x="410.0" y="32" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6D7378" text-anchor="middle" letter-spacing="0.06em">DOWNLOAD</text><text x="492.0" y="32" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6D7378" text-anchor="middle" letter-spacing="0.06em">TRANSCRIBE</text><text x="574.0" y="32" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6D7378" text-anchor="middle" letter-spacing="0.06em">DETECT</text><text x="656.0" y="32" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6D7378" text-anchor="middle" letter-spacing="0.06em">VALIDATE</text><text x="738.0" y="32" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6D7378" text-anchor="middle" letter-spacing="0.06em">CUT</text><text x="820.0" y="32" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6D7378" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text><rect x="20" y="46" width="840" height="86" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1"/><text x="44" y="74" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#272B30" text-anchor="start">Reprocess</text><text x="44" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#6D7378" text-anchor="start">The routine option</text><rect x="372" y="75" width="76" height="28" rx="4" fill="#F0F2F4" stroke="#D3D9DE" stroke-width="1"/><text x="410.0" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">reused</text><rect x="454" y="75" width="76" height="28" rx="4" fill="#F0F2F4" stroke="#D3D9DE" stroke-width="1"/><text x="492.0" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#6D7378" text-anchor="middle">reused</text><rect x="536" y="75" width="76" height="28" rx="4" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="574.0" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#279BBE" text-anchor="middle">runs</text><rect x="618" y="75" width="76" height="28" rx="4" fill="#D4EBF2" stroke="#279BBE" stroke-width="1"/><text x="656.0" y="94" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sa