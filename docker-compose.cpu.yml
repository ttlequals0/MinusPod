# =============================================================================
# CPU-only MinusPod (issue #184). No GPU required.
#
# Pulls ttlequals0/minuspod:cpu (or pin via MINUSPOD_VERSION=2.0.21-cpu) from
# Docker Hub. To build locally instead -- e.g. when modifying Dockerfile.cpu --
# uncomment the `build:` block below and run with `--build`.
#
# Usage:
#   1. Copy .env.example to .env and set ANTHROPIC_API_KEY (or your LLM choice).
#   2. mkdir -p data
#   3. docker compose -f docker-compose.cpu.yml up -d
#
# Select local faster-whisper, Parakeet, or a remote API in .env.
# See docs/installation.md for backend sizing and docs/transcription.md for setup.
# =============================================================================

services:
  minuspod:
    image: ttlequals0/minuspod:${MINUSPOD_VERSION:-cpu}
    stop_grace_period: ${MINUSPOD_STOP_GRACE_PERIOD:-360s}
    # Uncomment to build locally from Dockerfile.cpu instead of pulling.
    # build:
    #   context: .
    #   dockerfile: Dockerfile.cpu
    # No `platform:` pin - the CPU image is published as a multi-arch
    # manifest (linux/amd64 + linux/arm64). Docker picks the matching
    # variant automatically. Add `platform: linux/amd64` here only if you
    # need to force amd64 emulation on an arm64 host.
    # The container ships a non-root `minuspod` user at UID/GID 1000
    # (entrypoint.sh drops root via setpriv after fixing volume ownership).
    # Override here to pin a specific APP_UID/APP_GID if your volume is
    # owned by a different user -- e.g. `user: "2000:2000"`.
    # user: "1000:1000"
    ports:
      - "${MINUSPOD_BIND_ADDRESS:-0.0.0.0}:${MINUSPOD_PORT:-8000}:${MINUSPOD_PORT:-8000}"
    volumes:
      - ./data:/app/data
      # Optional: bake in your own replace.mp3, the sound played where ads were
      # removed. Usually unnecessary: Settings > Audio > Replacement audio
      # uploads one to ./data, which takes precedence and survives a rebuild.
      # - ./assets:/app/assets:ro
    environment:
      # =================================================================
      # LLM Provider Configuration (set in .env file)
      # =================================================================
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY}
      - SYSTEMONE_API_KEY=${SYSTEMONE_API_KEY}
      - SYSTEMONE_BASE_URL=${SYSTEMONE_BASE_URL}

      # =================================================================
      # Transcription configuration, CPU defaults
      # =================================================================
      # local (faster-whisper), parakeet, or openai-api; saved settings take precedence.
      - WHISPER_BACKEND=${WHISPER_BACKEND:-local}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-auto}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-en}
      - WHISPER_API_BASE_URL=${WHISPER_API_BASE_URL:-}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
      - WHISPER_API_MODEL=${WHISPER_API_MODEL:-whisper-1}

      # =================================================================
      # Server Configuration
      # =================================================================
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      # Internal listen port. Default 8000. Useful for host networking or
      # running multiple instances. Ignored when GUNICORN_BIND is set.
      - MINUSPOD_PORT=${MINUSPOD_PORT:-8000}
      # Server log targets: unset = console, empty = disabled, path = file.
      # - GUNICORN_ACCESS_LOG=/app/data/access.log
      # - GUNICORN_ERROR_LOG=/app/data/error.log

      # Per-episode download size cap in MB. Raise for feeds with very
      # long or high-bitrate episodes; failure messages name this var.
      - MAX_AUDIO_DOWNLOAD_MB=${MAX_AUDIO_DOWNLOAD_MB:-500}

      # =================================================================
      # 2.0.0+ Security (defaults shown; override via .env when needed)
      # =================================================================
      # Encrypts provider API keys and API-downloaded database backups.
      - MINUSPOD_MASTER_PASSPHRASE=${MINUSPOD_MASTER_PASSPHRASE:-}
      - MINUSPOD_REQUIRE_AUTH=${MINUSPOD_REQUIRE_AUTH:-true}
      - MINUSPOD_SETUP_TOKEN=${MINUSPOD_SETUP_TOKEN:-}
      - MINUSPOD_ALLOW_PUBLIC_PROCESSING=${MINUSPOD_ALLOW_PUBLIC_PROCESSING:-false}

      # Auto follows BASE_URL. Override only for unusual proxy setups.
      # serving over plain HTTP.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-auto}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-Strict}

      # Set once the deployment is HTTPS-only. HSTS traps browsers so
      # do not flip this on a dual-protocol setup.
      - MINUSPOD_ENABLE_HSTS=${MINUSPOD_ENABLE_HSTS:-false}

      # Use a shared backend to enforce exact limits across workers.
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-memory-threadsafe://}

      # Opt-in error reporting. URL or DSN from sentry.io.
      # - SENTRY_DSN=${SENTRY_DSN}

      # =================================================================
      # Reverse proxy / tunnel
      # =================================================================
      # Number of trusted proxy hops in front of this container.
      # 0 (default) = no proxy. 1 = one proxy (Cloudflare, nginx, Traefik).
      # See README "Client IP for login lockout".
      - MINUSPOD_TRUSTED_PROXY_COUNT=${MINUSPOD_TRUSTED_PROXY_COUNT:-0}

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${MINUSPOD_PORT:-8000}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    expose:
      - "${MINUSPOD_PORT:-8000}"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # The entrypoint chowns the data volume and drops root via setpriv, which
      # needs these caps; under a bare cap_drop: ALL it crash-loops. Omit this
      # block if you set `user:` above (the entrypoint then needs no caps).
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
